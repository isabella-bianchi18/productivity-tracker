<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Productivity Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--surface:#fff;--card-task:#ede9fe;--card-reward:#dbeafe;--card-sleep:#f3e8ff;--card-neutral:#f3f4f6;--border:#e5e7eb;--accent:#a78bfa;--accent-dark:#7c3aed;--accent2:#7dd3fc;--success:#86efac;--success-dark:#22c55e;--warning:#fcd34d;--warning-dark:#f59e0b;--danger:#fca5a5;--danger-dark:#ef4444;--text:#1f2937;--text-dim:#6b7280;--radius:14px;--shadow:0 1px 4px rgba(0,0,0,0.05)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:90px;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<div id="toast-container"></div>
<div id="modal-container"></div>
<script>
// ===== DATA =====
const DEFAULT_DATA={tasks:[],points:0,pointsHistory:[],rewards:[],techniques:[],settings:{gistId:'',token:'',dailyGoal:0},dailyGoalLog:{},streak:0,fractional:0};
let D=JSON.parse(JSON.stringify(DEFAULT_DATA));
let view='tasks',toolsView='menu',expandedTech=null,inlineMinId=null;
let T={running:false,paused:false,mode:null,start:null,elapsed:0,workDur:25,breakDur:5,phase:'work',note:'',taskId:'',pts:1,per:15};
let toastTimer=null,tickInterval=null;

// ===== STORAGE =====
const SK='pt_v3';
function saveL(){localStorage.setItem(SK,JSON.stringify(D))}
function loadL(){const s=localStorage.getItem(SK);if(s)D={...JSON.parse(JSON.stringify(DEFAULT_DATA)),...JSON.parse(s)}}
async function gistPush(){const{gistId:g,token:t}=D.settings;if(!g||!t)return false;try{const r=await fetch(`https://api.github.com/gists/${g}`,{method:'PATCH',headers:{'Authorization':`token ${t}`,'Content-Type':'application/json'},body:JSON.stringify({files:{'productivity_data.json':{content:JSON.stringify(D)}}})});return r.ok}catch(e){return false}}
async function gistPull(){const{gistId:g,token:t}=D.settings;if(!g||!t)return false;try{const r=await fetch(`https://api.github.com/gists/${g}`,{headers:{'Authorization':`token ${t}`}});if(!r.ok)return false;const j=await r.json();const c=j.files['productivity_data.json']?.content;if(c){const remote=JSON.parse(c);const ls=D.settings;D={...JSON.parse(JSON.stringify(DEFAULT_DATA)),...remote,settings:ls};saveL();return true}}catch(e){}return false}
function save(){saveL();gistPush()}

// ===== UTILS =====
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function ptsToday(){return D.pointsHistory.filter(h=>h.date.slice(0,10)===today()&&h.type==='earned').reduce((s,h)=>s+h.points,0)}
function elapsed(){if(T.paused)return T.elapsed;if(T.running)return T.elapsed+Math.floor((Date.now()-T.start)/1000);return 0}

// Award points from timer, accumulating fractional remainders
function awardTimerPts(exactPts){
  D.fractional=(D.fractional||0)+exactPts;
  const whole=Math.floor(D.fractional);
  D.fractional-=whole;
  return whole;
}
function visibleTasks(){const n=new Date();return D.tasks.filter(t=>{if(t.type==='one-time')return!t.completed;if(t.type==='recurring'){if(!t.lastCompleted)return true;return(n-new Date(t.lastCompleted))/864e5>=t.cadenceDays}return true})}
function sleepingTasks(){const n=new Date();return D.tasks.filter(t=>t.type==='recurring'&&t.lastCompleted&&(n-new Date(t.lastCompleted))/864e5<t.cadenceDays).map(t=>({...t,left:Math.ceil(t.cadenceDays-(new Date()-new Date(t.lastCompleted))/864e5)})).sort((a,b)=>a.left-b.left)}
function checkGoal(){const t=today(),g=D.settings.dailyGoal;if(!g||g<=0)return;
  // Check if bonus already earned today by looking at actual history
  const alreadyEarned=D.pointsHistory.some(h=>h.date.slice(0,10)===t&&h.task==='🎯 Daily goal bonus');
  if(alreadyEarned)return;
  if(ptsToday()>=g){const b=Math.floor(g*0.25);D.points+=b;D.pointsHistory.push({date:new Date().toISOString(),task:'🎯 Daily goal bonus',points:b,type:'earned'});D.dailyGoalLog[t]=true;updateStreak();saveL();gistPush();confetti();showGoalModal(g,b)}}
function updateStreak(){let s=0,d=new Date();while(D.dailyGoalLog[d.toISOString().slice(0,10)]){s++;d.setDate(d.getDate()-1)}D.streak=s}

// ===== ACTIONS =====
function completeTask(tid,mins){
  const task=D.tasks.find(t=>t.id===tid);if(!task)return;
  const now=new Date().toISOString(),prev=JSON.parse(JSON.stringify(task)),prevP=D.points;
  if(task.type==='one-time'){task.completed=true;task.completedAt=now}
  else if(task.type==='recurring'){task.lastCompleted=now}
  let pts=task.points||0;
  if(task.timeBased&&mins)pts=Math.floor(mins*task.ptsAmount/task.ptsPerMinutes);
  if(pts<0)pts=0;
  D.points+=pts;
  const h={date:now,task:task.name,taskId:task.id,points:pts,type:'earned'};
  if(mins)h.minutes=mins;
  const prevHistLen=D.pointsHistory.length;
  D.pointsHistory.push(h);
  inlineMinId=null;saveL();gistPush();confetti();checkGoal();render();
  showUndo(()=>{Object.assign(task,prev);D.points=prevP;D.pointsHistory.length=prevHistLen;saveL();gistPush();render()});
}
function deleteTask(tid){D.tasks=D.tasks.filter(t=>t.id!==tid);save();render()}
function moveTask(tid,dir){
  const task=D.tasks.find(t=>t.id===tid);if(!task)return;
  const same=D.tasks.filter(t=>t.type===task.type),ti=same.findIndex(t=>t.id===tid);
  const si=dir==='up'?ti-1:ti+1;if(si<0||si>=same.length)return;
  const ai=D.tasks.indexOf(task),bi=D.tasks.indexOf(same[si]);
  [D.tasks[ai],D.tasks[bi]]=[D.tasks[bi],D.tasks[ai]];save();render();
}
function redeemReward(rid){
  const r=D.rewards.find(x=>x.id===rid);if(!r||D.points<r.cost)return;
  D.points-=r.cost;D.pointsHistory.push({date:new Date().toISOString(),task:'🎁 '+r.name,points:-r.cost,type:'spent'});save();render();
}
function moveReward(rid,dir){
  const i=D.rewards.findIndex(r=>r.id===rid),si=dir==='up'?i-1:i+1;
  if(si<0||si>=D.rewards.length)return;
  [D.rewards[i],D.rewards[si]]=[D.rewards[si],D.rewards[i]];save();render();
}
function deleteHistEntry(idx){
  const e=D.pointsHistory[idx];if(!e)return;
  if(e.type==='earned')D.points-=e.points;else D.points+=Math.abs(e.points);
  // If deleting a daily goal bonus, allow re-earning it
  if(e.task==='🎯 Daily goal bonus'){
    const day=e.date.slice(0,10);
    delete D.dailyGoalLog[day];
    updateStreak();
  }
  D.pointsHistory.splice(idx,1);
  // If this was a recurring task completion, check if we need to reset lastCompleted
  if(e.taskId){
    const task=D.tasks.find(t=>t.id===e.taskId);
    if(task&&task.type==='recurring'){
      const remaining=D.pointsHistory.filter(h=>h.taskId===e.taskId&&h.type==='earned');
      if(remaining.length>0){task.lastCompleted=remaining[remaining.length-1].date}
      else{task.lastCompleted=null}
    }
  }
  saveL();gistPush();render();
  // Check if daily bonus should be revoked (non-bonus points now below goal)
  const day=e.date.slice(0,10);
  const g=D.settings.dailyGoal;
  if(g>0){
    const nonBonusPts=D.pointsHistory.filter(h=>h.date.slice(0,10)===day&&h.type==='earned'&&h.task!=='🎯 Daily goal bonus').reduce((s,h)=>s+h.points,0);
    const bonusIdx=D.pointsHistory.findIndex(h=>h.date.slice(0,10)===day&&h.task==='🎯 Daily goal bonus');
    if(nonBonusPts<g&&bonusIdx>=0){
      const bonus=D.pointsHistory[bonusIdx];
      D.points-=bonus.points;
      D.pointsHistory.splice(bonusIdx,1);
      delete D.dailyGoalLog[day];
      updateStreak();
      saveL();gistPush();render();
    }
  }
  // Re-check if goal should be re-awarded (with slight delay so render completes)
  setTimeout(()=>checkGoal(),100);
}
function editHistEntry(idx,newPts){
  const e=D.pointsHistory[idx];if(!e)return;
  const diff=newPts-e.points;
  if(e.type==='earned')D.points+=diff;else D.points-=diff;
  e.points=newPts;save();render();
}

// ===== CONFETTI =====
function confetti(){const cv=document.getElementById('confetti-canvas'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#a78bfa','#7dd3fc','#86efac','#fcd34d','#fca5a5','#f9a8d4'];const ps=Array.from({length:50},()=>({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*7,vy:Math.random()*3+2,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()*7+3,r:Math.random()*360,rv:(Math.random()-.5)*10}));let f=0;(function a(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.r+=p.rv;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s/2);cx.restore()});if(++f<70)requestAnimationFrame(a);else cx.clearRect(0,0,cv.width,cv.height)})()}

// ===== TOAST =====
function toast(msg){const c=document.getElementById('toast-container');c.innerHTML=`<div class="toast">${msg}</div>`;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{c.innerHTML='';toastTimer=null},3500)}
function showUndo(fn){const c=document.getElementById('toast-container'),uid='u'+id();c.innerHTML=`<div class="toast">✅ Done! <button id="${uid}" class="undo-btn">Undo</button></div>`;if(toastTimer)clearTimeout(toastTimer);setTimeout(()=>document.getElementById(uid)?.addEventListener('click',()=>{clearTimeout(toastTimer);c.innerHTML='';toastTimer=null;fn()}),0);toastTimer=setTimeout(()=>{c.innerHTML='';toastTimer=null},4000)}

// ===== MODAL =====
function modal(html){const m=document.getElementById('modal-container');m.innerHTML=`<div class="modal-bg"><div class="modal-box">${html}</div></div>`;m.querySelector('[data-close]')?.addEventListener('click',closeM);m.querySelector('.modal-bg')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeM()})}
function closeM(){document.getElementById('modal-container').innerHTML=''}

// Inline confirm (no browser popup)
function confirmAction(msg,onYes){
  modal(`<p style="margin-bottom:16px;font-size:0.95rem;">${msg}</p>
    <div style="display:flex;gap:8px;"><button id="ca-yes" class="btn btn-danger" style="flex:1;">Yes, delete</button><button data-close class="btn btn-muted" style="flex:1;">Cancel</button></div>`);
  document.getElementById('ca-yes')?.addEventListener('click',()=>{closeM();onYes()});
}

function showInfoModal(){
  modal(`<h2 style="margin-bottom:12px;color:var(--accent-dark);">📖 Points Guide</h2>
    <h3 style="font-size:.9rem;margin:10px 0 4px;">Task Points</h3>
    <table style="width:100%;font-size:.85rem;"><tr><td><b>1–3</b></td><td>Quick (water, make bed)</td></tr><tr><td><b>5–10</b></td><td>Medium (organize, workout)</td></tr><tr><td><b>15–25</b></td><td>Significant (deep clean, study)</td></tr><tr><td><b>50+</b></td><td>Major (finish project)</td></tr><tr><td><b>Timer</b></td><td>~1pt per 10–15 min</td></tr></table>
    <h3 style="font-size:.9rem;margin:14px 0 4px;">Reward Costs</h3>
    <table style="width:100%;font-size:.85rem;"><tr><td><b>25–50</b></td><td>Small (coffee)</td></tr><tr><td><b>100–200</b></td><td>Medium (takeout, book)</td></tr><tr><td><b>300–500</b></td><td>Big (gadget)</td></tr><tr><td><b>1000+</b></td><td>Major (trip)</td></tr></table>
    <button data-close class="btn btn-primary" style="margin-top:16px;width:100%;">Got it</button>`);
}

function showCongratsModal(note,totalSecs,pts){
  const mins=Math.floor(totalSecs/60),secs=totalSecs%60;
  const timeStr=mins>0?`${mins} minute${mins!==1?'s':''}${secs>0?' '+secs+' second'+(secs!==1?'s':''):''}`:`${secs} second${secs!==1?'s':''}`;
  modal(`<div style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">🎉</div>
    <h2 style="color:var(--accent-dark);margin-bottom:12px;">Great work!</h2>
    <p style="margin-bottom:8px;">You worked on <strong>${note||'your task'}</strong> for <strong>${timeStr}</strong>, earning <strong>${pts} point${pts!==1?'s':''}.</strong></p>
    <p style="color:var(--text-dim);font-size:.85rem;margin-bottom:16px;">Keep up the great work! 💪</p>
    <button data-close class="btn bpri" style="width:100%;">Nice!</button>
  </div>`);
}

function showGoalModal(goal,bonus){
  const streak=D.streak;
  modal(`<div style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">🎯</div>
    <h2 style="color:var(--accent-dark);margin-bottom:12px;">Daily goal crushed!</h2>
    <p style="margin-bottom:8px;">You hit your <strong>${goal} point</strong> goal today!</p>
    <p style="margin-bottom:8px;">Bonus: <strong>+${bonus} points</strong></p>
    ${streak>1?`<p style="color:var(--warning-dark);font-size:.9rem;margin-bottom:8px;">🔥 ${streak} day streak!</p>`:''}
    <p style="color:var(--text-dim);font-size:.85rem;margin-bottom:16px;">You're building something great. Keep it going! 🚀</p>
    <button data-close class="btn bpri" style="width:100%;">Let's go!</button>
  </div>`);
}

function showSurpriseModal(){
  modal(`<div style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">🎲</div>
    <h2 style="color:var(--accent-dark);margin-bottom:12px;">Surprise me!</h2>
    <p style="color:var(--text-dim);font-size:.85rem;margin-bottom:12px;">Enter a max point value and get a random task.</p>
    <input id="surp-max" type="number" min="1" placeholder="Max points" class="inf" style="text-align:center">
    <button id="surp-go" class="btn bsuc" style="width:100%;margin-bottom:8px;">Go!</button>
    <div id="surp-result" style="margin-top:12px;"></div>
    <button data-close class="btn bmut" style="width:100%;margin-top:12px;">Close</button>
  </div>`);
  document.getElementById('surp-go')?.addEventListener('click',()=>{
    const max=parseInt(document.getElementById('surp-max')?.value);
    if(!Number.isInteger(max)||max<1)return;
    // Include time-based tasks (you can earn any amount by adjusting time) and flat tasks at or below max
    const candidates=visibleTasks().filter(t=>t.timeBased||t.points<=max);
    const res=document.getElementById('surp-result');
    if(candidates.length===0){res.innerHTML='<p style="color:var(--text-dim);font-style:italic;">No tasks available. Try a higher number!</p>';return}
    const pick=candidates[Math.floor(Math.random()*candidates.length)];
    let detail='';
    if(pick.timeBased){
      const minsNeeded=Math.ceil(max*pick.ptsPerMinutes/pick.ptsAmount);
      detail=`<div style="font-size:.85rem;color:var(--text-dim);">${pick.type} · ${pick.ptsAmount}pt/${pick.ptsPerMinutes}m</div><div style="font-size:.85rem;color:var(--success-dark);margin-top:4px;">⏱ ~${minsNeeded} min for ${max} pts</div>`;
    } else {
      detail=`<div style="font-size:.85rem;color:var(--text-dim);">${pick.type} · ${pick.points} pts</div>`;
    }
    res.innerHTML=`<div style="background:var(--card-task);border-radius:var(--radius);padding:16px;"><div style="font-size:1.1rem;font-weight:bold;margin-bottom:4px;">${pick.name}</div>${detail}</div>`;
  });
}

// ===== RENDER =====
function render(){document.getElementById('app').innerHTML=rHeader()+(view==='tasks'?rTasks():'')+(view==='rewards'?rRewards():'')+(view==='history'?rHistory():'')+(view==='tools'?rTools():'')+rNav();bindAll()}
function tickRender(){const el=document.getElementById('tld'),pl=document.getElementById('tlp');if(!el){render();return}const e=elapsed();if(T.mode==='sw'){const m=Math.floor(e/60),s=e%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(pl){const p=Math.floor(e*T.pts/(T.per*60));pl.textContent=`${p} point${p!==1?'s':''} earned so far`}}else if(T.mode==='pm'){const tgt=(T.phase==='work'?T.workDur:T.breakDur)*60,rem=Math.max(0,tgt-e),m=Math.floor(rem/60),s=rem%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(pl&&T.phase==='work'){const p=Math.floor(e*T.pts/(T.per*60));pl.textContent=`${p} point${p!==1?'s':''} this session`}}}

function rHeader(){
  const g=D.settings.dailyGoal||0,e=ptsToday(),p=g>0?Math.min(100,Math.round(e/g*100)):0,sk=D.streak>1?`<div style="font-size:.75rem;color:var(--warning-dark);margin-top:4px;text-align:center">🔥 ${D.streak} day streak</div>`:'';
  return `<header class="hdr"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:1.3rem;color:var(--accent-dark)">⚡ Tracker</h1><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:bold">🪙 ${D.points}</span><button id="goal-btn" class="ibtn">🎯</button><button id="info-btn" class="ibtn">ℹ️</button><button id="set-btn" class="ibtn">⚙️</button></div></div>${g>0?`<div style="margin-top:8px;display:flex;align-items:center;gap:8px"><div class="pbar"><div class="pfill" style="width:${p}%;background:${p>=100?'var(--success)':'var(--accent)'}"></div></div><span style="font-size:.75rem;color:var(--text-dim)">${e}/${g}</span></div>${sk}`:''}</header>`}

function rNav(){
  const tabs=[{v:'tasks',i:'📋',l:'Tasks'},{v:'rewards',i:'🎁',l:'Rewards'},{v:'history',i:'📅',l:'History'},{v:'tools',i:'🧰',l:'Tools'}];
  return `<nav class="bnav">${tabs.map(t=>`<button class="nbtn ${view===t.v?'nact':''}" data-v="${t.v}"><span style="font-size:1.3rem">${t.i}</span><span>${t.l}</span></button>`).join('')}</nav>`}

// ===== TASKS =====
function rTasks(){
  const vis=visibleTasks(),ot=vis.filter(t=>t.type==='one-time'),rc=vis.filter(t=>t.type==='recurring'),ev=vis.filter(t=>t.type==='evergreen'),sl=sleepingTasks();
  return `<div class="vc">${rBucket('🎯 One-Time',ot)}${rBucket('🔄 Recurring',rc)}${sl.length?rSleep(sl):''}${rBucket('♾️ Evergreen',ev)}<div style="display:flex;gap:8px;margin-bottom:8px"><button id="show-af" class="abtn" style="flex:1">+ Add Task</button><button id="surprise-btn" class="btn bwar" style="flex-shrink:0;padding:14px 16px;border-radius:var(--radius);font-size:1rem">🎲 Surprise me</button></div><div id="afc"></div></div>`}
function rBucket(title,tasks){return `<div style="margin-bottom:18px"><h2 style="font-size:1rem;color:var(--accent-dark);margin-bottom:8px">${title}</h2>${tasks.length?tasks.map((t,i)=>rCard(t,i,tasks.length)).join(''):'<p style="color:var(--text-dim);font-size:.85rem;font-style:italic">Nothing here ✨</p>'}</div>`}
function rCard(t,i,n){
  const isM=inlineMinId===t.id,pl=t.timeBased?`${t.ptsAmount}/${t.ptsPerMinutes}m`:`+${t.points}`;
  return `<div class="tcard"><div style="display:flex;align-items:center;gap:10px"><button class="cbtn" data-id="${t.id}">✓</button><div style="flex:1;min-width:0;cursor:pointer" class="tdet" data-id="${t.id}"><div style="font-weight:600;font-size:.9rem">${t.name}</div>${t.type==='recurring'?`<div style="font-size:.7rem;color:var(--text-dim)">Every ${t.cadenceDays}d</div>`:''}${t.timeBased?'<div style="font-size:.7rem;color:var(--accent-dark)">⏱ time-based</div>':''}</div><span style="color:var(--warning-dark);font-weight:bold;font-size:.8rem">${pl}</span><div style="display:flex;flex-direction:column;gap:1px">${i>0?`<button class="mbtn" data-id="${t.id}" data-d="up">▲</button>`:'<div style="height:16px"></div>'}${i<n-1?`<button class="mbtn" data-id="${t.id}" data-d="down">▼</button>`:'<div style="height:16px"></div>'}</div></div>${isM?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center"><input id="imi" type="number" min="1" placeholder="Minutes" class="inf" style="flex:1;margin:0"><button id="ims" data-id="${t.id}" class="btn bsuc" style="padding:8px 14px">Submit</button><button id="imc" class="btn bmut" style="padding:8px 10px">✕</button></div>`:''}</div>`}
function rSleep(tasks){return `<div style="margin-bottom:18px"><h3 style="font-size:.85rem;color:var(--text-dim);margin-bottom:6px">💤 Upcoming</h3>${tasks.map(t=>`<div class="slcard sldet" data-id="${t.id}" style="cursor:pointer"><span>${t.name}</span><span style="color:var(--accent-dark);font-weight:600">↻ ${t.left}d</span></div>`).join('')}</div>`}

// ===== HISTORY =====
let hM=new Date().getMonth(),hY=new Date().getFullYear(),selDay=null;
function rHistory(){
  const dim=new Date(hY,hM+1,0).getDate(),fd=new Date(hY,hM,1).getDay(),mn=new Date(hY,hM).toLocaleString('default',{month:'long',year:'numeric'});
  let cells='';for(let i=0;i<fd;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${hY}-${String(hM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ents=D.pointsHistory.filter(h=>h.date.slice(0,10)===ds);
    const earned=ents.filter(h=>h.type==='earned').reduce((s,h)=>s+h.points,0);
    const sel=selDay===ds,td=ds===today(),has=ents.length>0;
    let cls='cc';if(sel)cls+=' csel';else if(has)cls+=' cact';if(td)cls+=' ctd';
    cells+=`<div class="${cls}" data-d="${ds}"><span class="cn">${d}</span>${has?`<span class="cdot${sel?' cdotw':''}">${earned||''}</span>`:''}</div>`}

  let detail='';
  if(selDay){
    const ents=D.pointsHistory.filter(h=>h.date.slice(0,10)===selDay);
    if(ents.length){detail=ents.map(e=>{const time=new Date(e.date).toLocaleTimeString('default',{hour:'numeric',minute:'2-digit'});const idx=D.pointsHistory.indexOf(e);return `<div class="hent"><div style="flex:1"><div style="font-size:.85rem;font-weight:500">${e.task}</div><div style="font-size:.7rem;color:var(--text-dim)">${time}${e.minutes?' · '+e.minutes+'m':''}</div></div><span class="hpts ${e.type==='earned'?'hpe':'hps'}">${e.type==='earned'?'+':''}${e.points}</span><button class="hedit ibtn" data-idx="${idx}">✏️</button><button class="hdel ibtn" data-idx="${idx}">🗑️</button></div>`}).join('')}
    else detail='<p style="color:var(--text-dim);font-style:italic;font-size:.85rem">No activity.</p>'}

  return `<div class="vc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><button class="hnav ibtn" data-d="prev">◀</button><h2 style="font-size:1rem;color:var(--accent-dark)">${mn}</h2><button class="hnav ibtn" data-d="next">▶</button></div><div class="calbox"><div class="cgrid">${['S','M','T','W','T','F','S'].map(x=>`<div class="ch">${x}</div>`).join('')}${cells}</div></div>${selDay?`<div class="fcard" style="margin-top:14px"><h3 style="font-size:.9rem;margin-bottom:10px">${new Date(selDay+'T12:00:00').toLocaleDateString('default',{weekday:'long',month:'short',day:'numeric'})}</h3>${detail}</div>`:''}</div>`}

function rPM(){

function showTaskDetail(tid){
  const task=D.tasks.find(t=>t.id===tid);if(!task)return;
  const hist=D.pointsHistory.filter(h=>h.taskId===tid),tc=hist.length,tm=hist.reduce((s,h)=>s+(h.minutes||0),0);

-align:center"><span class="rl">min</span></div></div><div id="ee" class="err"></div><div style="display:flex;gap:8px;margin-top:8px"><button id="esv" data-id="${task.id}" class="btn bpri" style="flex:1">Save</button><button id="edl" data-id="${task.id}" class="btn bdan" style="padding:10px 16px">🗑️</button></div><button data-close class="btn bmut" style="margin-top:10px;width:100%">Close</button>`);
  document.getElementById('ety')?.addEventListener('change',e=>{document.getElementById('ecw').style.display=e.target.value==='recurring'?'':'none'});

  document.getElementById('esv')?.addEventListener('click',()=>{const n=document.getElementById('en').value.trim(),ty=document.getElementById('ety').value,tb=document.getElementById('etb').checked,err=document.getElementById('ee');if(!n){err.textContent='Name required';err.style.display='block';return}if(tb){const a=parseInt(document.getElementById('epa').value),b=parseInt(document.getElementById('epp').value);if(!Number.isInteger(a)||a<1||!Number.isInteger(b)||b<1){err.textContent='Valid pts/min required';err.style.display='block';return}task.timeBased=true;task.ptsAmount=a;task.ptsPerMinutes=b;task.points=a}else{const p=parseInt(document.getElementById('ept').value);if(!Number.isInteger(p)||p<1){err.textContent='Valid points required';err.style.display='block';return}task.timeBased=false;task.points=p}task.name=n;task.type=ty;if(ty==='recurring'){const c=parseInt(document.getElementById('ecd').value);if(!Number.isInteger(c)||c<1){err.textContent='Valid cadence required';err.style.display='block';return}task.cadenceDays=c}save();closeM();render()});
  document.getElementById('edl')?.addEventListener('click',()=>confirmAction('Delete this task?',()=>{deleteTask(tid);closeM()}));

// ===== FORM HELPERS =====
function bindAddForm(){
  document.getElementById('tft')?.addEventListener('change',e=>{document.getElementById('tfc').style.display=e.target.value==='recurring'?'block':'none';valTF()});
  document.getElementById('tftb')?.addEventListener('change',e=>{document.getElementById('tffw').style.display=e.target.checked?'none':'';document.getElementById('tftw').style.display=e.target.checked?'':'none';valTF()});
  ['tfn','tfp','tfpa','tfpp','tfcd'].forEach(x=>document.getElementById(x)?.addEventListener('input',valTF));
  document.getElementById('tfs')?.addEventListener('click',()=>{
    const n=document.getElementById('tfn').value.trim(),ty=document.getElementById('tft').value,tb=document.getElementById('tftb').checked;
    const task={id:id(),name:n,type:ty,timeBased:tb};
    if(tb){task.ptsAmount=parseInt(document.getElementById('tfpa').value);task.ptsPerMinutes=parseInt(document.getElementById('tfpp').value);task.points=task.ptsAmount}
    else task.points=parseInt(document.getElementById('tfp').value);
    if(ty==='recurring')task.cadenceDays=parseInt(document.getElementById('tfcd').value);
    if(ty==='one-time')task.completed=false;
    D.tasks.push(task);save();render()});
}
function valTF(){
  const n=document.getElementById('tfn')?.value.trim(),tb=document.getElementById('tftb')?.checked,ty=document.getElementById('tft')?.value;
  const btn=document.getElementById('tfs'),err=document.getElementById('tfe');if(!btn||!err)return;
  let ok=true,msg='';
  if(!n){ok=false;msg='Name required'}
  else if(tb){const a=parseInt(document.getElementById('tfpa')?.value),b=parseInt(document.getElementById('tfpp')?.value);if(!Number.isInteger(a)||a<1||!Number.isInteger(b)||b<1){ok=false;msg='Valid pts/min required'}}
  else{const p=parseInt(document.getElementById('tfp')?.value);if(!Number.isInteger(p)||p<1){ok=false;msg='Valid points required'}}
  if(ok&&ty==='recurring'){const c=parseInt(document.getElementById('tfcd')?.value);if(!Number.isInteger(c)||c<1){ok=false;msg='Valid cadence required'}}
  err.textContent=msg;err.style.display=ok?'none':'block';btn.disabled=!ok;btn.style.opacity=ok?'1':'.5';
}
function valRF(){
  const n=document.getElementById('rfn')?.value.trim(),c=parseInt(document.getElementById('rfc')?.value);
  const btn=document.getElementById('rfs'),err=document.getElementById('rfe');if(!btn||!err)return;
  let ok=true,msg='';if(!n){ok=false;msg='Name required'}else if(!Number.isInteger(c)||c<1){ok=false;msg='Valid cost required'}

function valPM(){
  const t=document.getElementById('pmt')?.value,n=document.getElementById('pmn')?.value.trim();

// ===== TIMER =====
function startSW(){
  const p=parseInt(document.getElementById('swp').value),r=parseInt(document.getElementById('swr').value);
  T={running:true,paused:false,mode:'sw',start:Date.now(),elapsed:0,workDur:25,breakDur:5,phase:'work',
    note:document.getElementById('swn')?.value||'',taskId:document.getElementById('swt')?.value||'',pts:p,per:r};
  startTick()}
function startPM(){
  const p=parseInt(document.getElementById('pmp').value),r=parseInt(document.getElementById('pmr').value);
  const w=parseInt(document.getElementById('pmw')?.value)||25,b=parseInt(document.getElementById('pmb')?.value)||5;
  T={running:true,paused:false,mode:'pm',start:Date.now(),elapsed:0,workDur:w,breakDur:b,phase:'work',
    note:document.getElementById('pmn')?.value||'',taskId:document.getElementById('pmt')?.value||'',pts:p,per:r};
  startTick()}
function pause(){T.elapsed=elapsed();T.running=false;T.paused=true;clearInterval(tickInterval);render()}
function resume(){T.running=true;T.paused=false;T.start=Date.now();startTick()}

function startTick(){
  if(tickInterval)clearInterval(tickInterval);render();
  tickInterval=setInterval(()=>{
    if(!T.running){clearInterval(tickInterval);return}
    if(T.mode==='pm'){
      const e=elapsed(),tgt=(T.phase==='work'?T.workDur:T.breakDur)*60;
      if(e>=tgt){
        if(T.phase==='work'){
          const exactPts=T.workDur*60*T.pts/(T.per*60),pts=awardTimerPts(exactPts);
          if(pts>0){const lbl=T.note||D.tasks.find(t=>t.id===T.taskId)?.name||'🍅 Pomodoro';D.points+=pts;D.pointsHistory.push({date:new Date().toISOString(),task:'🍅 '+lbl,taskId:T.taskId||null,points:pts,type:'earned',minutes:T.workDur});saveL();gistPush();confetti();toast(`🍅 +${pts} pts! Break time!`);checkGoal()}
          T.phase='break'}else{T.phase='work';toast('💪 Break over!')}
        T.elapsed=0;T.start=Date.now()}}
    // Only update timer display
    if(view==='tools'&&(toolsView==='sw'||toolsView==='pm'))tickRender();
  },1000)}

function stopSW(){
  const e=elapsed();
  const label=T.note||D.tasks.find(t=>t.id===T.taskId)?.name||'Stopwatch';
  T.running=false;T.paused=false;clearInterval(tickInterval);
  const mins=Math.floor(e/60),exactPts=e*T.pts/(T.per*60),pts=awardTimerPts(exactPts);
  if(pts>0){D.points+=pts;D.pointsHistory.push({date:new Date().toISOString(),task:'⏱️ '+label,taskId:T.taskId||null,points:pts,type:'earned',minutes:mins});saveL();gistPush();confetti();checkGoal();
    T={running:false,paused:false,mode:null,start:null,elapsed:0,workDur:T.workDur,breakDur:T.breakDur,phase:'work',note:'',taskId:'',pts:1,per:15};render();showCongratsModal(label,e,pts)}
  else{if(mins>0)toast(`⏱️ ${mins}min (fractional points saved for next time)`);
    saveL();T={running:false,paused:false,mode:null,start:null,elapsed:0,workDur:T.workDur,breakDur:T.breakDur,phase:'work',note:'',taskId:'',pts:1,per:15};render()}}

function stopPM(){
  const e=elapsed();
  const label=T.note||D.tasks.find(t=>t.id===T.taskId)?.name||'Pomodoro';
  T.running=false;T.paused=false;clearInterval(tickInterval);
  if(T.phase==='work'){
    const mins=Math.floor(e/60),exactPts=e*T.pts/(T.per*60),pts=awardTimerPts(exactPts);
    if(pts>0){D.points+=pts;D.pointsHistory.push({date:new Date().toISOString(),task:'🍅 '+label,taskId:T.taskId||null,points:pts,type:'earned',minutes:mins});saveL();gistPush();checkGoal();
      T={running:false,paused:false,mode:null,start:null,elapsed:0,workDur:T.workDur,breakDur:T.breakDur,phase:'work',note:'',taskId:'',pts:1,per:15};render();showCongratsModal(label,e,pts);return}
    else{saveL()}
  }
  T={running:false,paused:false,mode:null,start:null,elapsed:0,workDur:T.workDur,breakDur:T.breakDur,phase:'work',note:'',taskId:'',pts:1,per:15};render()}

// ===== INIT =====
loadL();updateStreak();
if(D.settings.gistId&&D.settings.token)gistPull().then(()=>{updateStreak();render()});
else render();
</script>

.nbtn{flex:1;padding:6px 4px;border:none;background:transparent;color:var(--text-dim);font-size:.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:center}
.nact{color:var(--accent-dark)}
.tlcard{width:100%;padding:16px;margin-bottom:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);text-align:left;cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.tlcard:active{transform:scale(.98)}
.tdesc{font-size:.8rem;color:var(--text-dim)}
.dis{opacity:.4;cursor:not-allowed}
.tback{display:block;margin-bottom:12px;background:none;border:none;color:var(--accent-dark);cursor:pointer;font-size:.9rem;text-align:left}
.tdis{font-size:3.5rem;font-weight:bold;font-family:'SF Mono',SFMono-Regular,ui-monospace,monospace;margin:16px 0;color:var(--text)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:25px;font-size:.85rem;font-weight:500;z-index:9998;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;white-space:nowrap;max-width:90vw}
.undo-btn{background:var(--warning);color:#000;border:none;padding:6px 12px;border-radius:12px;font-weight:bold;font-size:.8rem;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:9990;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.08)}
code{background:var(--card-neutral);padding:2px 6px;border-radius:4px;font-size:.8rem}
a{color:var(--accent-dark)}
</style>
</body></html>

<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>

<div id="modal-container"></div>
<script>
// ===== DATA =====
const APP_VERSION='3.0.0';
const DEFAULT_DATA={tasks:[],points:0,pointsHistory:[],rewards:[],techniques:[],metrics:[],settings:{gistId:'',token:'',dailyGoal:0},dailyGoalLog:{},streak:0,fractional:0,groupOrder:[],plan:[]};
let D=JSON.parse(JSON.stringify(DEFAULT_DATA));
let view='tasks',toolsView='menu',expandedTech=null,inlineMinId=null,categoryFilter='all',recurSort='custom';
const collapsedGroups=new Set();
let T={running:false,paused:false,mode:null,start:null,elapsed:0,workDur:25,breakDur:5,phase:'work',note:'',taskId:'',pts:1,per:15,planMode:false,planQueue:[],planTimes:{},planCurrentStart:0,planCompleted:[],planCounts:{}};
let toastTimer=null,tickInterval=null;

// ===== STORAGE =====
const SK='pt_v3';
function saveL(){localStorage.setItem(SK,JSON.stringify(D))}
function loadL(){const s=localStorage.getItem(SK);if(s)D={...JSON.parse(JSON.stringify(DEFAULT_DATA)),...JSON.parse(s)}}
let pushTimeout=null;
async function gistPush(){const{gistId:g,token:t}=D.settings;if(!g||!t)return false;
  const pushData=JSON.parse(JSON.stringify(D));delete pushData.settings.token;delete pushData.settings.gistId;
  try{const r=await fetch(`https://api.github.com/gists/${g}`,{method:'PATCH',headers:{'Authorization':`token ${t}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({files:{'productivity_data.json':{content:JSON.stringify(pushData)}}})});return r.ok}catch(e){return false}}
function debouncedPush(){if(pushTimeout)clearTimeout(pushTimeout);pushTimeout=setTimeout(()=>{gistPush()},5000)}
async function gistPull(){const{gistId:g,token:t}=D.settings;if(!g||!t)return false;try{const r=await fetch(`https://api.github.com/gists/${g}`,{headers:{'Authorization':`token ${t}`,'Accept':'application/vnd.github.v3+json'}});if(!r.ok)return false;const j=await r.json();const c=j.files['productivity_data.json']?.content;if(c){const remote=JSON.parse(c);const ls=D.settings;D={...JSON.parse(JSON.stringify(DEFAULT_DATA)),...remote,settings:ls};saveL();return true}}catch(e){}return false}
function save(){saveL();debouncedPush()}

// ===== UTILS =====
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return localISO().slice(0,10)}
function localISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString()}
function ptsToday(){return D.pointsHistory.filter(h=>h.date.slice(0,10)===today()&&h.type==='earned').reduce((s,h)=>s+h.points,0)}
function getLevel(){
  const totalEarned=D.pointsHistory.filter(h=>h.type==='earned').reduce((s,h)=>s+h.points,0);
  // Each level requires more XP: level N needs N*50 XP to reach from level N-1
  // Total XP for level L = 50*(1+2+3+...+L) = 25*L*(L+1)
  // Solve: 25*L*(L+1) <= totalEarned => L ~ sqrt(totalEarned/25)
  let level=0,xpNeeded=0;
  while(true){const next=xpNeeded+(level+1)*50;if(next>totalEarned)break;xpNeeded=next;level++}
  const currentLevelXp=totalEarned-xpNeeded;
  const nextLevelXp=(level+1)*50;
  return{level,xp:currentLevelXp,xpNeeded:nextLevelXp,totalXp:totalEarned,pct:Math.min(100,Math.round(currentLevelXp/nextLevelXp*100))};
}
function elapsed(){if(T.paused)return T.elapsed;if(T.running)return T.elapsed+Math.floor((Date.now()-T.start)/1000);return 0}

const CAT_COLORS={work:'#dbeafe',home:'#d1fae5',growth:'#fef3c7'};
const CAT_LABELS={work:'💼 Work',home:'🏠 Home',growth:'🌱 Growth'};
function catBg(cat){return CAT_COLORS[cat]||'var(--card-task)'}

function getGoalProgress(task){
  if(!task.goal||!task.goal.target||task.goal.target<1)return null;
  const now=new Date();let periodStart;
  if(task.goal.period==='hourly'){periodStart=new Date(now);periodStart.setMinutes(0,0,0)}
  else if(task.goal.period==='daily'){periodStart=new Date(now.getFullYear(),now.getMonth(),now.getDate())}
  else if(task.goal.period==='weekly'){const d=new Date(now);d.setDate(d.getDate()-d.getDay()+1);periodStart=new Date(d.getFullYear(),d.getMonth(),d.getDate())}
  else if(task.goal.period==='monthly'){periodStart=new Date(now.getFullYear(),now.getMonth(),1)}
  else if(task.goal.period==='annually'){periodStart=new Date(now.getFullYear(),0,1)}
  const psStr=periodStart.toISOString().slice(0,task.goal.period==='hourly'?13:10);
  const entries=D.pointsHistory.filter(h=>h.taskId===task.id&&h.type==='earned'&&h.date.slice(0,psStr.length)>=psStr);
  const current=task.timeBased?entries.reduce((s,h)=>s+(h.minutes||0),0):task.countBased?entries.reduce((s,h)=>s+(h.count||0),0):entries.length;
  return{current,target:task.goal.target,pct:Math.min(100,Math.round(current/task.goal.target*100)),period:task.goal.period};
}

function getGoalStreak(task){
  if(!task.goal)return 0;
  const skips=new Set(task.goalSkips||[]);
  const now=new Date();let streak=0;
  // Determine the start of the CURRENT period (to exclude from backward loop)
  let currentPeriodStart;
  if(task.goal.period==='daily'){currentPeriodStart=today()}
  else if(task.goal.period==='weekly'){const wd=new Date(now);wd.setDate(wd.getDate()-wd.getDay()+1);currentPeriodStart=new Date(wd.getFullYear(),wd.getMonth(),wd.getDate()).toISOString().slice(0,10)}
  else if(task.goal.period==='monthly'){currentPeriodStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10)}
  // Start backward loop from the period BEFORE the current one
  let d=new Date(now);
  if(task.goal.period==='daily'){d.setDate(d.getDate()-1)}
  else if(task.goal.period==='weekly'){d.setDate(d.getDate()-d.getDay()+1);d.setDate(d.getDate()-1)}
  else if(task.goal.period==='monthly'){d.setDate(0)}
  for(let i=0;i<365;i++){
    let pStart,psStr;
    if(task.goal.period==='daily'){pStart=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-1)}
    else if(task.goal.period==='weekly'){const wd=new Date(d);wd.setDate(wd.getDate()-wd.getDay()+1);pStart=new Date(wd.getFullYear(),wd.getMonth(),wd.getDate());d.setDate(d.getDate()-7)}
    else if(task.goal.period==='monthly'){pStart=new Date(d.getFullYear(),d.getMonth(),1);d.setMonth(d.getMonth()-1)}
    else break;
    psStr=pStart.toISOString().slice(0,10);
    // Don't double-count the current period
    if(psStr===currentPeriodStart)continue;
    // Skip days preserve streak
    if(skips.has(psStr)){streak++;continue}
    const pEndD=task.goal.period==='daily'?new Date(pStart.getTime()+864e5):task.goal.period==='weekly'?new Date(pStart.getTime()+7*864e5):new Date(pStart.getFullYear(),pStart.getMonth()+1,1);
    const entries=D.pointsHistory.filter(h=>h.taskId===task.id&&h.type==='earned'&&h.date.slice(0,10)>=psStr&&h.date.slice(0,10)<pEndD.toISOString().slice(0,10));
    const val=task.timeBased?entries.reduce((s,h)=>s+(h.minutes||0),0):task.countBased?entries.reduce((s,h)=>s+(h.count||0),0):entries.length;
    if(val>=task.goal.target)streak++;else break;
  }
  // Add +1 if the CURRENT period is also completed
  if(!skips.has(currentPeriodStart)){
    let todayStart=currentPeriodStart,todayEnd;
    if(task.goal.period==='daily'){todayEnd=new Date(new Date(todayStart+'T00:00:00').getTime()+864e5).toISOString().slice(0,10)}
    else if(task.goal.period==='weekly'){todayEnd=new Date(new Date(todayStart+'T00:00:00').getTime()+7*864e5).toISOString().slice(0,10)}
    else if(task.goal.period==='monthly'){const ps=new Date(todayStart+'T00:00:00');todayEnd=new Date(ps.getFullYear(),ps.getMonth()+1,1).toISOString().slice(0,10)}
    if(todayStart&&todayEnd){
      const todayEntries=D.pointsHistory.filter(h=>h.taskId===task.id&&h.type==='earned'&&h.date.slice(0,10)>=todayStart&&h.date.slice(0,10)<todayEnd);
      const todayVal=task.timeBased?todayEntries.reduce((s,h)=>s+(h.minutes||0),0):task.countBased?todayEntries.reduce((s,h)=>s+(h.count||0),0):todayEntries.length;
      if(todayVal>=task.goal.target)streak++;
    }
  } else {streak++}
  return streak;
}

// Helper: streak for daily tasks without goals (start from yesterday, add today if done)
function getDailyStreak(task){
  let streak=0;const now=new Date();let d=new Date(now);d.setDate(d.getDate()-1);
  for(let i=0;i<365;i++){
    const ds=d.toISOString().slice(0,10);
    const hasEntry=D.pointsHistory.some(h=>h.taskId===task.id&&h.type==='earned'&&h.date.slice(0,10)===ds);
    if(hasEntry){streak++}else break;
    d.setDate(d.getDate()-1);
  }
  // Add today if also completed
  const todayStr=today();
  const doneToday=D.pointsHistory.some(h=>h.taskId===task.id&&h.type==='earned'&&h.date.slice(0,10)===todayStr);
  if(doneToday)streak++;
  return streak;
}

// Award points from timer, accumulating fractional remainders
function awardTimerPts(exactPts){
  D.fractional=(D.fractional||0)+exactPts;
  const whole=Math.floor(D.fractional);
  D.fractional-=whole;
  return whole;
}
function visibleTasks(){const n=new Date();const td=today();return D.tasks.filter(t=>{if(t.archived)return false;if(t.hiddenToday&&t.hiddenToday.includes(td))return false;if(t.goalSkips&&t.goalSkips.includes(td))return false;if(t.type==='one-time')return!t.completed;if(t.type==='recurring'){if(!t.lastCompleted)return true;return(n-new Date(t.lastCompleted))/864e5>=t.cadenceDays}if(t.type==='daily'){if(!t.lastCompleted){const completedToday=D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));return!completedToday}const completedToday=D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));return!completedToday}return true})}
function sleepingTasks(){const n=new Date();const td=today();return D.tasks.filter(t=>{if(t.archived)return false;if(t.hiddenToday&&t.hiddenToday.includes(td))return true;if(t.goalSkips&&t.goalSkips.includes(td))return true;if(t.type==='recurring'&&t.lastCompleted&&(n-new Date(t.lastCompleted))/864e5<t.cadenceDays)return true;if(t.type==='daily'){const completedToday=D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));if(completedToday)return true}return false}).map(t=>{if(t.hiddenToday&&t.hiddenToday.includes(td))return{...t,left:'hidden'};if(t.goalSkips&&t.goalSkips.includes(td)&&t.type!=='daily'&&t.type!=='recurring')return{...t,left:'skipped'};if(t.type==='daily'){const skippedToday=t.goalSkips&&t.goalSkips.includes(td);return{...t,left:skippedToday?'skipped':1}}if(t.type==='recurring')return{...t,left:Math.ceil(t.cadenceDays-(new Date()-new Date(t.lastCompleted))/864e5)};return{...t,left:'skipped'}}).sort((a,b)=>(typeof a.left==='string'?0:a.left)-(typeof b.left==='string'?0:b.left))}
function checkGoal(){const t=today(),g=D.settings.dailyGoal;if(!g||g<=0)return;
  // Store what goal was set for today
  if(!D.dailyGoalLog[t]||D.dailyGoalLog[t]===true)D.dailyGoalLog[t]=g;
  const alreadyEarned=D.pointsHistory.some(h=>h.date.slice(0,10)===t&&h.task==='🎯 Daily goal bonus');
  if(alreadyEarned)return;
  if(ptsForDay(t)>=g){const b=Math.floor(g*0.25);D.points+=b;D.pointsHistory.push({date:localISO(),task:'🎯 Daily goal bonus',points:b,type:'earned'});updateStreak();saveL();debouncedPush();confetti();showGoalModal(g,b)}}

function checkGoalForDay(day){
  const g=D.dailyGoalLog[day];if(!g||g===true)return;
  const nonBonus=D.pointsHistory.filter(h=>h.date.slice(0,10)===day&&h.type==='earned'&&h.task!=='🎯 Daily goal bonus').reduce((s,h)=>s+h.points,0);
  const bonusIdx=D.pointsHistory.findIndex(h=>h.date.slice(0,10)===day&&h.task==='🎯 Daily goal bonus');
  if(nonBonus>=g&&bonusIdx<0){
    const b=Math.floor(g*0.25);D.points+=b;D.pointsHistory.push({date:day+'T00:00:00.000Z',task:'🎯 Daily goal bonus',points:b,type:'earned'});updateStreak();saveL();debouncedPush();render();
  } else if(nonBonus<g&&bonusIdx>=0){
    D.points-=D.pointsHistory[bonusIdx].points;D.pointsHistory.splice(bonusIdx,1);updateStreak();saveL();debouncedPush();render();
  }
}

function ptsForDay(day){return D.pointsHistory.filter(h=>h.date.slice(0,10)===day&&h.type==='earned'&&h.task!=='🎯 Daily goal bonus').reduce((s,h)=>s+h.points,0)}

function updateStreak(){
  // Calculate current and longest streak; days without a goal don't break or count
  let current=0,longest=0,s=0,d=new Date();
  // Go back up to 365 days
  for(let i=0;i<365;i++){
    const ds=d.toISOString().slice(0,10);
    const g=D.dailyGoalLog[ds];
    if(g&&g!==true){
      // Had a goal this day
      const earned=ptsForDay(ds);
      if(earned>=g){s++;if(s>longest)longest=s}
      else{if(current===0)current=s;s=0}
    }
    // No goal: skip (don't break streak)
    d.setDate(d.getDate()-1);
  }
  if(current===0)current=s;
  D.streak=current;D.longestStreak=Math.max(longest,current);
}

// ===== ACTIONS =====
function completeTask(tid,mins,finished){
  const task=D.tasks.find(t=>t.id===tid);if(!task)return;
  const now=localISO(),prev=JSON.parse(JSON.stringify(task)),prevP=D.points;
  // Only mark complete if not time-based, or if finished=true for time-based
  const shouldComplete=(!task.timeBased&&!task.countBased)||((task.timeBased||task.countBased)&&finished!==false);
  if(shouldComplete){
    if(task.type==='one-time'){task.completed=true;task.completedAt=now}
    else if(task.type==='recurring'||task.type==='daily'){task.lastCompleted=now}
  }
  let pts=task.points||0;
  if(task.timeBased&&mins)pts=Math.floor(mins*task.ptsAmount/task.ptsPerMinutes);
  if(task.countBased&&mins)pts=Math.floor(mins*task.ptsAmount/task.ptsPerCount);
  if(pts<0)pts=0;
  // Completion bonus: 10% of ALL points earned for this task since last completion
  let bonus=0;
  if(task.timeBased&&finished===true){
    const prevEarned=D.pointsHistory.filter(h=>h.taskId===tid&&h.type==='earned'&&!h.task.includes('✅')).reduce((s,h)=>s+h.points,0);
    bonus=Math.floor((prevEarned+pts)*0.1);
  }
  D.points+=pts+bonus;
  const h={date:now,task:task.name+((task.timeBased&&finished===false)||(task.countBased&&finished===false)?'':' ✅'),taskId:task.id,points:pts+bonus,type:'earned',bonus:bonus,category:task.category||'',taskType:task.type};
  if(task.timeBased&&mins)h.minutes=mins;
  if(task.countBased&&mins){h.count=mins;h.countUnit=task.countUnit}
  if(task.timeBased){h.rate=`${task.ptsAmount} points per ${task.ptsPerMinutes} minute${task.ptsPerMinutes>1?'s':''}`}
  if(task.countBased){h.rate=`${task.ptsAmount} points per ${task.ptsPerCount} ${task.countUnit}`}
  const prevHistLen=D.pointsHistory.length;
  D.pointsHistory.push(h);
  inlineMinId=null;saveL();debouncedPush();confetti();checkGoal();
  // Check if task goal was just met
  if(task.goal){const gp=getGoalProgress(task);if(gp&&gp.pct>=100){const contribution=task.timeBased?(mins||0):task.countBased?(mins||0):1;if(gp.current-contribution<task.goal.target)setTimeout(()=>{const tc=document.getElementById('toast-container');const goalToast=document.createElement('div');goalToast.className='toast';goalToast.style.cssText='bottom:auto;top:80px';goalToast.textContent='🎯 '+task.name+' goal hit!';tc.appendChild(goalToast);setTimeout(()=>goalToast.remove(),3000)},500)}}
  render();
  const bonusMsg=bonus>0?` (includes +${bonus} completion bonus!)`:'';
  showUndo(()=>{Object.assign(task,prev);D.points=prevP;D.pointsHistory.length=prevHistLen;saveL();debouncedPush();render()});
  setTimeout(checkAchievements,600);
}
function deleteTask(tid){D.tasks=D.tasks.filter(t=>t.id!==tid);save();render()}
function moveTask(tid,dir){
  const task=D.tasks.find(t=>t.id===tid);if(!task)return;
  const same=D.tasks.filter(t=>t.type===task.type),ti=same.findIndex(t=>t.id===tid);
  const si=dir==='up'?ti-1:ti+1;if(si<0||si>=same.length)return;
  const ai=D.tasks.indexOf(task),bi=D.tasks.indexOf(same[si]);
  [D.tasks[ai],D.tasks[bi]]=[D.tasks[bi],D.tasks[ai]];save();render();
}
function redeemReward(rid){
  const r=D.rewards.find(x=>x.id===rid);if(!r||D.points<r.cost)return;
  D.points-=r.cost;D.pointsHistory.push({date:localISO(),task:'🎁 '+r.name,points:-r.cost,type:'spent'});save();render();
}
function moveReward(rid,dir){
  const i=D.rewards.findIndex(r=>r.id===rid),si=dir==='up'?i-1:i+1;
  if(si<0||si>=D.rewards.length)return;
  [D.rewards[i],D.rewards[si]]=[D.rewards[si],D.rewards[i]];save();render();
}
function deleteHistEntry(idx){
  const e=D.pointsHistory[idx];if(!e)return;
  const day=e.date.slice(0,10);
  if(e.type==='earned')D.points-=e.points;else D.points+=Math.abs(e.points);
  D.pointsHistory.splice(idx,1);
  // If this was a recurring or one-time task completion, reset state
  if(e.taskId){
    const task=D.tasks.find(t=>t.id===e.taskId);
    if(task&&(task.type==='recurring'||task.type==='daily')){
      const remaining=D.pointsHistory.filter(h=>h.taskId===e.taskId&&h.type==='earned');
      if(remaining.length>0){task.lastCompleted=remaining[remaining.length-1].date}
      else{task.lastCompleted=null}
    }
    if(task&&task.type==='one-time'&&task.completed){
      const hasCompletion=D.pointsHistory.some(h=>h.taskId===e.taskId&&h.type==='earned'&&h.task.includes('✅'));
      if(!hasCompletion){task.completed=false;task.completedAt=null}
    }
  }
  // If this was a grouped plan entry, revert each sub-task's completion
  if(e.planTasks&&e.planTasks.length){
    e.planTasks.forEach(st=>{
      if(!st.completed)return;
      const task=D.tasks.find(t=>t.id===st.taskId);if(!task)return;
      if(task.type==='one-time'){task.completed=false;task.completedAt=null}
      else if(task.type==='recurring'||task.type==='daily'){
        const remaining=D.pointsHistory.filter(h=>h.taskId===st.taskId&&h.type==='earned');
        if(remaining.length>0){task.lastCompleted=remaining[remaining.length-1].date}
        else{task.lastCompleted=null}
      }
    });
  }
  saveL();debouncedPush();render();
  setTimeout(()=>checkGoalForDay(day),100);
}
function editHistEntry(idx,newPts){
  const e=D.pointsHistory[idx];if(!e)return;
  const diff=newPts-e.points;
  if(e.type==='earned')D.points+=diff;else D.points-=diff;
  e.points=newPts;save();render();
}

// ===== CONFETTI =====
function confetti(){const cv=document.getElementById('confetti-canvas'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#a78bfa','#7dd3fc','#86efac','#fcd34d','#fca5a5','#f9a8d4'];const ps=Array.from({length:50},()=>({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*7,vy:Math.random()*3+2,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()*7+3,r:Math.random()*360,rv:(Math.random()-.5)*10}));let f=0;(function a(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.r+=p.rv;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s/2);cx.restore()});if(++f<70)requestAnimationFrame(a);else cx.clearRect(0,0,cv.width,cv.height)})()}

// ===== TOAST =====
function toast(msg){const c=document.getElementById('toast-container');c.innerHTML=`<div class="toast">${msg}</div>`;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{c.innerHTML='';toastTimer=null},3500)}
function showUndo(fn){const c=document.getElementById('toast-container'),uid='u'+id();c.innerHTML=`<div class="toast">✅ Done! <button id="${uid}" class="undo-btn">Undo</button></div>`;if(toastTimer)clearTimeout(toastTimer);const btn=document.getElementById(uid);if(btn)btn.addEventListener('click',()=>{clearTimeout(toastTimer);c.innerHTML='';toastTimer=null;fn()});toastTimer=setTimeout(()=>{c.innerHTML='';toastTimer=null},4000)}

// ===== MODAL =====
function modal(html){const m=document.getElementById('modal-container');m.innerHTML=`<div class="modal-bg"><div class="modal-box">${html}</div></div>`;m.querySelector('[data-close]')?.addEventListener('click',closeM);m.querySelector('.modal-bg')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeM()})}
function closeM(){document.getElementById('modal-container').innerHTML=''}

// Inline confirm (no browser popup)
function confirmAction(msg,onYes){
  modal(`<p style="margin-bottom:16px;font-size:0.95rem;">${msg}</p>
    <div style="display:flex;gap:8px;"><button id="ca-yes" class="btn btn-danger" style="flex:1;">Yes, delete</button><button data-close class="btn btn-muted" style="flex:1;">Cancel</button></div>`);
  document.getElementById('ca-yes')?.addEventListener('click',()=>{closeM();onYes()});
}

      <p style="font-size:.8rem;color:var(--text-dim);margin-bottom:8px">Formula: (minutes ÷ 15) × annoyance + importance</p>
      <label class="rl">Minutes</label><input id="calc-min" type="number" min="1" placeholder="How long?" class="inf">
      <label class="rl">Annoyance</label><select id="calc-ann" class="inf"><option value="1">1 – Breeze</option><option value="2">2 – Mild</option><option value="3" selected>3 – Moderate</option><option value="4">4 – Draining</option><option value="5">5 – Agonizing</option></select>

      <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
        <input id="rcalc-num" type="number" min="1" placeholder="#" class="inf" style="width:70px;margin:0;text-align:center">
        <select id="rcalc-unit" class="inf" style="margin:0;flex:1"><option value="1">days</option><option value="7">weeks</option><option value="30">months</option></select>
      </div>

  function calcTask(){const m=parseInt(document.getElementById('calc-min')?.value),a=parseInt(document.getElementById('calc-ann')?.value),i=parseInt(document.getElementById('calc-imp')?.value);if(!m||!a||!i)return;const pts=Math.round((m/15)*a+i);document.getElementById('calc-result').textContent=pts+' points'}
  function calcReward(){const n=parseInt(document.getElementById('rcalc-num')?.value),u=parseInt(document.getElementById('rcalc-unit')?.value);if(!n||!u)return;const cost=n*u*48;document.getElementById('rcalc-result').textContent=cost+' points'}

function showSurpriseModal(){
  modal(`<div style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">🎲</div>
    <h2 style="color:var(--accent-dark);margin-bottom:12px;">Surprise me!</h2>

  </div>`);
  document.getElementById('surp-go')?.addEventListener('click',()=>{
    const max=parseInt(document.getElementById('surp-max')?.value);
    if(!Number.isInteger(max)||max<1)return;
    // Include time-based tasks (you can earn any amount by adjusting time) and flat tasks at or below max
    const candidates=visibleTasks().filter(t=>categoryFilter==='all'||t.category===categoryFilter).filter(t=>t.timeBased||t.points<=max);

    if(candidates.length===0){res.innerHTML='<p style="color:var(--text-dim);font-style:italic;">No tasks available. Try a higher number!</p>';return}

      const minsNeeded=Math.ceil(max*pick.ptsPerMinutes/pick.ptsAmount);
      detail=`<div style="font-size:.85rem;color:var(--text-dim);">${pick.type} · ${pick.ptsAmount}pt/${pick.ptsPerMinutes}m</div><div style="font-size:.85rem;color:var(--success-dark);margin-top:4px;">⏱ ~${minsNeeded} min for ${max} pts</div>`;

    }
    res.innerHTML=`<div style="background:var(--card-task);border-radius:var(--radius);padding:16px;"><div style="font-size:1.1rem;font-weight:bold;margin-bottom:4px;">${pick.name}</div>${detail}</div>`;
  });
}

// ===== RENDER =====
function render(){document.getElementById('app').innerHTML=rHeader()+(view==='tasks'?rTasks():'')+(view==='plan'?rPlan():'')+(view==='history'?rHistory():'')+(view==='tools'?rTools():'')+rNav();bindAll()}
function tickRender(){const el=document.getElementById('tld'),pl=document.getElementById('tlp');if(!el){render();return}const e=elapsed();if(T.mode==='sw'){const m=Math.floor(e/60),s=e%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(pl){const p=Math.floor(e*T.pts/(T.per*60));pl.textContent=`${p} point${p!==1?'s':''} earned so far`}}else if(T.mode==='pm'){const tgt=(T.phase==='work'?T.workDur:T.breakDur)*60,rem=Math.max(0,tgt-e),m=Math.floor(rem/60),s=rem%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(pl&&T.phase==='work'){const p=Math.floor(e*T.pts/(T.per*60));pl.textContent=`${p} point${p!==1?'s':''} this session`}}}

function rHeader(){
  const g=D.settings.dailyGoal||0,e=ptsToday(),p=g>0?Math.min(100,Math.round(e/g*100)):0,sk=D.streak>1?`<div style="font-size:.75rem;color:var(--warning-dark);margin-top:4px;text-align:center">🔥 ${D.streak} day streak</div>`:'';

  const lvBar=`<div style="margin-top:6px;display:flex;align-items:center;gap:8px"><span style="font-size:.7rem;color:var(--text-dim)">Lv.${lv.level}</span><div class="pbar"><div class="pfill" style="width:${lv.pct}%;background:var(--accent)"></div></div><span style="font-size:.65rem;color:var(--text-dim)">${lv.xp}/${lv.xpNeeded}</span></div>`;
  return `<header class="hdr"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:1.3rem;color:var(--accent-dark)">⚡ Tracker</h1><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:bold">✨ ${D.points}</span><button id="goal-btn" class="ibtn">🎯</button><button id="info-btn" class="ibtn">💡</button><button id="set-btn" class="ibtn">⚙️</button></div></div>${dailyGoalBar}${lvBar}</header>`}

function rNav(){
  const tabs=[{v:'tasks',i:'🚀',l:'Tasks'},{v:'plan',i:'📋',l:'Plan'},{v:'history',i:'🗓️',l:'History'},{v:'tools',i:'🧰',l:'Tools'}];
  return `<nav class="bnav">${tabs.map(t=>`<button class="nbtn ${view===t.v?'nact':''}" data-v="${t.v}"><span style="font-size:1.3rem">${t.i}</span><span>${t.l}</span></button>`).join('')}</nav>`}

// ===== PLAN =====
function checkPlanComplete(){
  if(!D.plan||!D.plan.length)return;
  const td=today();
  const allTasks=D.tasks.filter(t=>!t.archived);
  const planItems=D.plan.map(pid=>allTasks.find(t=>t.id===pid)).filter(Boolean);
  const allDone=planItems.every(t=>{
    if(t.type==='one-time')return t.completed;
    if(t.type==='daily')return D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));
    if(t.type==='recurring')return t.lastCompleted&&(new Date()-new Date(t.lastCompleted))/864e5<t.cadenceDays;
    if(t.type==='evergreen')return D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));
    return false;
  });
  if(allDone){
    setTimeout(()=>{
      confetti();
      const planPts=D.pointsHistory.filter(h=>h.date.slice(0,10)===td&&h.type==='earned'&&planItems.some(t=>t.id===h.taskId)).reduce((s,h)=>s+h.points,0);
      modal(`<div style="text-align:center"><div style="font-size:2.5rem;margin-bottom:8px">🎉🏆</div><h2 style="color:var(--accent-dark);margin-bottom:8px">Plan complete!</h2><p style="font-size:.9rem;color:var(--text-dim);margin-bottom:8px">You crushed all ${planItems.length} task${planItems.length>1?'s':''}!</p><p style="font-size:1.1rem;font-weight:bold;color:var(--success-dark);margin-bottom:16px">${planPts} points earned today</p><p style="font-size:.85rem;color:var(--text-dim);margin-bottom:16px">Time to enjoy the rest of your day 🌟</p><button data-close class="btn bpri" style="width:100%">Let's go!</button></div>`);
    },500);
  }
}

function rPlan(){
  if(!D.plan)D.plan=[];
  const td=today();
  // Get all tasks (any type) that exist and aren't archived
  const allTasks=D.tasks.filter(t=>!t.archived);
  // Build plan items with task data
  const planItems=D.plan.map(pid=>allTasks.find(t=>t.id===pid)).filter(Boolean);
  // Check which plan items are "done" today
  function isDoneToday(t){
    if(t.type==='one-time')return t.completed;
    if(t.type==='daily')return D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));
    if(t.type==='recurring')return t.lastCompleted&&(new Date()-new Date(t.lastCompleted))/864e5<t.cadenceDays;
    // Evergreen: done in plan if completed today (has ✅ entry today)
    if(t.type==='evergreen')return D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));
    return false;
  }
  const doneCount=planItems.filter(t=>isDoneToday(t)).length;
  const totalCount=planItems.length;
  const pct=totalCount>0?Math.round(doneCount/totalCount*100):0;

  // Available tasks to add (not already in plan, not completed, not skipped/hidden today, not sleeping recurring)
  const planSet=new Set(D.plan);
  const available=allTasks.filter(t=>!planSet.has(t.id)&&!(t.type==='one-time'&&t.completed)&&!(t.goalSkips&&t.goalSkips.includes(td))&&!(t.hiddenToday&&t.hiddenToday.includes(td))&&!(t.type==='recurring'&&t.lastCompleted&&(new Date()-new Date(t.lastCompleted))/864e5<t.cadenceDays));

  // Progress bar
  const planMinsToday=D.pointsHistory.filter(h=>h.date.slice(0,10)===td&&h.type==='earned'&&planItems.some(t=>t.id===h.taskId)).reduce((s,h)=>s+(h.minutes||0),0);
  const planPtsToday=D.pointsHistory.filter(h=>h.date.slice(0,10)===td&&h.type==='earned'&&planItems.some(t=>t.id===h.taskId)).reduce((s,h)=>s+h.points,0);
  const timeStr=planMinsToday>=60?`${Math.floor(planMinsToday/60)}h ${planMinsToday%60}m`:`${planMinsToday}m`;
  const progressBar=totalCount>0?`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-dim);margin-bottom:4px"><span>${doneCount}/${totalCount} done</span><span>${planPtsToday} pts · ${timeStr}</span></div><div style="height:8px;background:var(--card-neutral);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct>=100?'var(--success)':'var(--accent)'};border-radius:4px;transition:width .3s"></div></div></div>`:'';

  // Render plan items
  const cards=planItems.map((t,i)=>{
    const done=isDoneToday(t);
    const pl=t.timeBased?`${t.ptsAmount} pts / ${t.ptsPerMinutes} min`:t.countBased?`${t.ptsAmount} pts / ${t.ptsPerCount} ${t.countUnit}`:`+${t.points}`;
    const isM=inlineMinId===t.id;
    return `<div class="tcard" style="background:${done?'var(--card-neutral)':catBg(t.category)};${done?'opacity:.6':''}"><div style="display:flex;align-items:center;gap:10px"><button class="plan-done-btn cbtn-plan" data-id="${t.id}" style="${done?'opacity:.4':''}">${done?'✓':'○'}</button><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.9rem;${done?'text-decoration:line-through;color:var(--text-dim)':''}">${t.name}</div></div><span style="color:var(--warning-dark);font-weight:bold;font-size:.75rem">${pl}</span><div style="display:flex;flex-direction:column;gap:1px">${i>0?`<button class="plan-move" data-id="${t.id}" data-d="up">▲</button>`:'<div style="height:16px"></div>'}${i<planItems.length-1?`<button class="plan-move" data-id="${t.id}" data-d="down">▼</button>`:'<div style="height:16px"></div>'}</div><button class="plan-rm ibtn" data-id="${t.id}" style="font-size:.7rem;color:var(--danger-dark)">✕</button></div>${isM?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">${t.countBased?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input id="imi-count" type="number" min="1" placeholder="" class="inf" style="width:70px;margin:0;text-align:center"><span class="rl">${t.countUnit||'units'}</span></div><div id="imi-preview" style="font-size:.8rem;color:var(--accent-dark);margin:6px 0;"></div>`:`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input id="imi-h" type="number" min="0" placeholder="" class="inf" style="width:60px;margin:0;text-align:center"><span class="rl">hours</span><input id="imi-m" type="number" min="0" max="59" placeholder="" class="inf" style="width:60px;margin:0;text-align:center"><span class="rl">minutes</span></div><div id="imi-preview" style="font-size:.8rem;color:var(--accent-dark);margin:6px 0;"></div>`}<div style="display:flex;gap:6px;flex-wrap:wrap"><button id="ims-work" data-id="${t.id}" class="btn bmut" style="padding:8px 10px;font-size:.8rem">Log</button><button id="ims-done" data-id="${t.id}" class="btn bsuc" style="padding:8px 10px;font-size:.8rem">Log + Done ✅</button><button id="imc" class="btn bmut" style="padding:8px 10px">✕</button></div></div>`:''}</div>`;
  }).join('');

  // Add task picker
  const opts=available.map(t=>`<option value="${t.id}">${t.name} (${t.type})</option>`).join('');
  const picker=`<div style="margin-bottom:16px"><select id="plan-add-select" class="inf" style="margin:0"><option value="">+ Add task to plan...</option>${opts}</select></div>`;

  const clearBtn=totalCount>0?`<button id="plan-clear" class="btn bmut" style="width:100%;margin-top:12px;font-size:.8rem">🗑️ Clear plan</button>`:'';

  return `<div class="vc"><h2 style="font-size:1.1rem;color:var(--accent-dark);margin-bottom:12px">📋 Today's Plan</h2>${progressBar}${picker}${cards||'<p style="color:var(--text-dim);font-style:italic;font-size:.85rem">No tasks planned yet. Add some above!</p>'}${clearBtn}</div>`;
}

// ===== TASKS =====
function rTasks(){
  let content='';
  if(categoryFilter==='archived'){
    // Show archived tasks only
    const arch=D.tasks.filter(t=>t.archived);
    const archCards=arch.length?arch.map((t,i)=>rCard(t,i,arch.length)).join(''):'<p style="color:var(--text-dim);font-size:.85rem;font-style:italic">No archived tasks.</p>';
    content=`<div style="margin-bottom:18px"><h2 style="font-size:1rem;color:var(--text-dim);margin-bottom:8px">📦 Archived</h2>${archCards}</div>`;
  } else {
    const vis=visibleTasks().filter(t=>!t.archived&&(categoryFilter==='all'||t.category===categoryFilter)),ot=vis.filter(t=>t.type==='one-time'&&!t.pinned);
    let rc=vis.filter(t=>t.type==='recurring'&&!t.pinned);
    if(recurSort==='due'){rc.sort((a,b)=>{const aOver=(a.lastCompleted?(new Date()-new Date(a.lastCompleted))/864e5-a.cadenceDays:999);const bOver=(b.lastCompleted?(new Date()-new Date(b.lastCompleted))/864e5-b.cadenceDays:999);return bOver-aOver})}
    const ev=vis.filter(t=>t.type==='evergreen'&&!t.pinned),dy=vis.filter(t=>t.type==='daily'&&!t.pinned),sl=sleepingTasks().filter(t=>!t.archived&&!t.pinned&&(categoryFilter==='all'||t.category===categoryFilter));
    const slRecurring=sl.filter(t=>t.type==='recurring'),slDaily=sl.filter(t=>t.type==='daily'),slOther=sl.filter(t=>t.type!=='recurring'&&t.type!=='daily');
    const pinned=vis.filter(t=>t.pinned);
    const pinnedSection=pinned.length?`<div style="margin-bottom:18px"><h2 style="font-size:1rem;color:var(--accent-dark);margin-bottom:8px">📌 Pinned</h2>${pinned.map((t,i)=>rCard(t,i,pinned.length)).join('')}</div>`:'';
    const td=today();const allSkippable=D.tasks.filter(t=>!t.archived&&(t.type==='daily'||(t.goal&&t.goal.period==='daily')));const allSkipped=allSkippable.length>0&&allSkippable.every(t=>t.goalSkips&&t.goalSkips.includes(td));
    content=`<div style="display:flex;gap:8px;margin-bottom:14px"><button id="show-af" class="abtn" style="flex:1">+ Add Task</button><div style="display:flex;flex-direction:column;gap:4px"><button id="quick-log-btn" class="btn bmut" style="padding:8px 10px;border-radius:8px;font-size:.75rem;line-height:1.2;text-align:center">⚡ Quick<br>Log</button><button id="bulk-skip-btn" class="btn ${allSkipped?'bwar':'bmut'}" style="padding:8px 10px;border-radius:8px;font-size:.75rem;line-height:1.2;text-align:center">⏭️ Skip<br>All</button></div><button id="surprise-btn" class="btn bwar" style="flex-shrink:0;padding:14px 12px;border-radius:var(--radius);font-size:1rem">🎲</button></div><div id="afc"></div><div id="qlfc"></div>${pinnedSection}${rBucket('🎯 One-Time',ot)}${rBucket('🔄 Recurring',rc,true)}${slRecurring.length?rSleep(slRecurring,'💤 Upcoming'):''}${rBucket('📅 Daily',dy)}${slDaily.length?rSleep(slDaily,'💤 Upcoming'):''}${rBucket('♾️ Evergreen',ev)}${slOther.length?rSleep(slOther,'🚫 Not Today'):''}`;
  }

function rBucket(title,tasks,sortable){

v style="display:flex;gap:6px;flex-wrap:wrap">${t.type==='evergreen'?`<button id="ims" data-id="${t.id}" class="btn bsuc" style="padding:8px 12px;font-size:.8rem">Submit</button>`:`<button id="ims-work" data-id="${t.id}" class="btn bmut" style="padding:8px 10px;font-size:.8rem">Worked on it</button><button id="ims-done" data-id="${t.id}" class="btn bsuc" style="padding:8px 10px;font-size:.8rem">Finished! 🎉</button>`}<button id="imc" class="btn bmut" style="padding:8px 10px">✕</button></div></div>`:''}</div>`}

function getAchievements(){
  const lifetime=D.pointsHistory.filter(h=>h.type==='earned').reduce((s,h)=>s+h.points,0);
  const totalTasks=D.pointsHistory.filter(h=>h.type==='earned'&&h.task!=='🎯 Daily goal bonus').length;
  const longestStreak=D.longestStreak||0;
  let speedDemon=false;
  const earned=D.pointsHistory.filter(h=>h.type==='earned'&&h.task!=='🎯 Daily goal bonus').sort((a,b)=>a.date.localeCompare(b.date));
  for(let i=0;i<earned.length-2;i++){const t1=new Date(earned[i].date),t3=new Date(earned[i+2].date);if((t3-t1)/36e5<=1){speedDemon=true;break}}
  return[
    {icon:'🌱',name:'First Task',desc:'Complete your first task',done:totalTasks>=1},
    {icon:'🔥',name:'Week Warrior',desc:'7-day streak',done:longestStreak>=7},
    {icon:'⚡',name:'Speed Demon',desc:'3 tasks in 1 hour',done:speedDemon},
    {icon:'💯',name:'Century Club',desc:'100 lifetime points',done:lifetime>=100},
    {icon:'⭐',name:'Rising Star',desc:'500 lifetime points',done:lifetime>=500},
    {icon:'🏔️',name:'Summiteer',desc:'1,000 lifetime points',done:lifetime>=1000},
    {icon:'🚀',name:'Rocket',desc:'2,000 lifetime points',done:lifetime>=2000},
    {icon:'👑',name:'Legend',desc:'5,000 lifetime points',done:lifetime>=5000},
    {icon:'💎',name:'Diamond',desc:'10,000 lifetime points',done:lifetime>=10000},
    {icon:'🔟',name:'Decathlon',desc:'10 tasks in one day',done:D.pointsHistory.some((_,__,arr)=>{const days={};arr.filter(h=>h.type==='earned'&&h.task!=='🎯 Daily goal bonus').forEach(h=>{const d=h.date.slice(0,10);days[d]=(days[d]||0)+1});return Object.values(days).some(v=>v>=10)})},
    {icon:'📅',name:'Consistency',desc:'30-day streak',done:longestStreak>=30},
  ];
}
function checkAchievements(){
  if(!D._unlockedAchievements)D._unlockedAchievements=[];
  const achievements=getAchievements();
  const newlyUnlocked=achievements.filter(a=>a.done&&!D._unlockedAchievements.includes(a.name));
  if(newlyUnlocked.length>0){
    newlyUnlocked.forEach(a=>D._unlockedAchievements.push(a.name));
    saveL();
    const a=newlyUnlocked[0];
    confetti();
    modal(`<div style="text-align:center;">

// ===== INSIGHTS =====
function rInsights(){
  const earned=D.pointsHistory.filter(h=>h.type==='earned'&&h.task!=='🎯 Daily goal bonus');
  if(earned.length<3)return `<div class="vc"><button class="tback">← Back</button><h2 style="font-size:1.1rem;color:var(--accent-dark);margin-bottom:12px">🔍 Insights</h2><p style="color:var(--text-dim);font-style:italic">Need more data — complete a few more tasks to see patterns!</p></div>`;
  // Best day of week
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const byDay=[0,0,0,0,0,0,0],byDayCount=[0,0,0,0,0,0,0];
  earned.forEach(h=>{const dow=new Date(h.date).getDay();byDay[dow]+=h.points;byDayCount[dow]++});
  const avgByDay=byDay.map((pts,i)=>{const uniqueDays=new Set(earned.filter(h=>new Date(h.date).getDay()===i).map(h=>h.date.slice(0,10))).size;return uniqueDays>0?Math.round(pts/uniqueDays):0});
  const bestDayIdx=avgByDay.indexOf(Math.max(...avgByDay));
  const worstDayIdx=avgByDay.indexOf(Math.min(...avgByDay.filter(v=>v>0)));
  // Best time of day (using local time from history timestamps)
  const byHour=Array(24).fill(0),byHourCount=Array(24).fill(0);
  earned.forEach(h=>{const hr=new Date(h.date).getHours();byHour[hr]+=h.points;byHourCount[hr]++});
  const timeBlocks=[
    {name:'Early Morning',range:'5–8a',hrs:[5,6,7]},
    {name:'Morning',range:'8a–12p',hrs:[8,9,10,11]},
    {name:'Afternoon',range:'12–5p',hrs:[12,13,14,15,16]},
    {name:'Evening',range:'5–9p',hrs:[17,18,19,20]},
    {name:'Night',range:'9p–12a',hrs:[21,22,23]},
  ];
  const blockPts=timeBlocks.map(b=>({...b,pts:b.hrs.reduce((s,hr)=>s+byHour[hr],0),count:b.hrs.reduce((s,hr)=>s+byHourCount[hr],0)}));
  const bestBlock=blockPts.reduce((a,b)=>b.pts>a.pts?b:a);
  // Day of week bar chart
  const maxDayPts=Math.max(...avgByDay,1);
  const dayBars=avgByDay.map((v,i)=>{const pct=Math.round(v/maxDayPts*100);return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:.75rem;width:30px;color:${i===bestDayIdx?'var(--success-dark)':i===worstDayIdx?'var(--danger-dark)':'var(--text-dim)'};font-weight:${i===bestDayIdx||i===worstDayIdx?'bold':'normal'}">${dayNames[i].slice(0,3)}</span><div style="flex:1;height:14px;background:var(--card-neutral);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${i===bestDayIdx?'var(--success)':i===worstDayIdx?'var(--danger)':'var(--accent)'};border-radius:4px"></div></div><span style="font-size:.7rem;color:var(--text-dim);width:30px;text-align:right">${v}</span></div>`}).join('');
  // Time block chart
  const maxBlockPts=Math.max(...blockPts.map(b=>b.pts),1);
  const blockBars=blockPts.map(b=>{const pct=Math.round(b.pts/maxBlockPts*100);const isBest=b===bestBlock;return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:.7rem;width:45px;color:var(--text-dim)">${b.range}</span><div style="flex:1;height:14px;background:var(--card-neutral);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${isBest?'var(--success)':'var(--accent)'};border-radius:4px"></div></div><span style="font-size:.7rem;color:var(--text-dim);width:30px;text-align:right">${b.pts}</span></div>`}).join('');
  // Category breakdown
  const cats={work:0,home:0,growth:0};
  earned.forEach(h=>{if(h.category&&cats[h.category]!==undefined)cats[h.category]+=h.points});
  const totalCatPts=Object.values(cats).reduce((s,v)=>s+v,0);
  const catBars=totalCatPts>0?Object.entries(cats).map(([k,v])=>{const pct=Math.round(v/totalCatPts*100);const label=k==='work'?'💼 Work':k==='home'?'🏠 Home':'🌱 Growth';return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:.75rem;width:60px">${label}</span><div style="flex:1;height:14px;background:var(--card-neutral);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px"></div></div><span style="font-size:.7rem;color:var(--text-dim);width:35px;text-align:right">${pct}%</span></div>`}).join(''):'';
  // Productivity score: rolling 7-day avg
  const last7=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);last7.push(ptsForDay(ds))}
  const avg7=Math.round(last7.reduce((s,v)=>s+v,0)/7);
  return `<div class="vc"><button class="tback">← Back</button><h2 style="font-size:1.1rem;color:var(--accent-dark);margin-bottom:16px">🔍 Insights</h2>
    <div class="fcard" style="margin-bottom:12px;text-align:center"><div style="font-size:.8rem;color:var(--text-dim);margin-bottom:4px">7-day average</div><div style="font-size:1.5rem;font-weight:bold;color:var(--accent-dark)">${avg7} pts/day</div></div>
    <div class="fcard" style="margin-bottom:12px"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px">📅 Best Day of Week</div><p style="font-size:.8rem;color:var(--text-dim);margin-bottom:8px">Average points per day (${dayNames[bestDayIdx]} is your best)</p>${dayBars}</div>
    <div class="fcard" style="margin-bottom:12px"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px">⏰ Best Time of Day</div><p style="font-size:.8rem;color:var(--text-dim);margin-bottom:8px">Total points by time block (${bestBlock.name} is your peak)</p>${blockBars}</div>
    ${catBars?`<div class="fcard" style="margin-bottom:12px"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px">🏷️ Category Breakdown</div>${catBars}</div>`:''}
  </div>`;
}
// ===== METRICS =====
function rCorrelation(){
  const opts=D.metrics.map(m=>`<option value="${m.id}" ${corrA===m.id?'selected':''}>${m.name}</option>`).join('');
  const opts2=D.metrics.map(m=>`<option value="${m.id}" ${corrB===m.id?'selected':''}>${m.name}</option>`).join('');
  let result='';
  if(corrA&&corrB&&corrA!==corrB){
    const mA=D.metrics.find(x=>x.id===corrA),mB=D.metrics.find(x=>x.id===corrB);
    if(mA&&mB){
      // Build day-aligned data
      const allDays=new Set([...mA.entries.map(e=>e.date),...mB.entries.map(e=>e.date)]);
      const sorted=[...allDays].sort();
      const pairs=[];
      for(const day of sorted){
        const aVal=mA.entries.find(e=>e.date===day);
        if(corrLag==='same'){const bVal=mB.entries.find(e=>e.date===day);if(aVal&&bVal)pairs.push({d:day,a:aVal.val,b:bVal.val})}
        else{const nextDay=new Date(day+'T12:00:00');nextDay.setDate(nextDay.getDate()+1);const nd=nextDay.toISOString().slice(0,10);const bVal=mB.entries.find(e=>e.date===nd);if(aVal&&bVal)pairs.push({d:day,a:aVal.val,b:bVal.val})}
      }
      if(pairs.length>=2){
        // Pearson correlation
        const n=pairs.length,am=pairs.reduce((s,p)=>s+p.a,0)/n,bm=pairs.reduce((s,p)=>s+p.b,0)/n;
        const num=pairs.reduce((s,p)=>s+(p.a-am)*(p.b-bm),0);
        const denA=Math.sqrt(pairs.reduce((s,p)=>s+(p.a-am)*(p.a-am),0));
        const denB=Math.sqrt(pairs.reduce((s,p)=>s+(p.b-bm)*(p.b-bm),0));
        const r=(denA&&denB)?num/(denA*denB):0;
        const label=r>0.6?'Strong positive 📈':r>0.3?'Weak positive':r>-0.3?'No correlation':r>-0.6?'Weak negative':'Strong negative 📉';
        // Overlay graph
        const w=260,h=80;
        const px=pairs.length>1?w/(pairs.length-1):0;
        const lineA=pairs.map((p,i)=>`${Math.round(i*px)},${Math.round(h-p.a*h/3)}`).join(' ');
        const lineB=pairs.map((p,i)=>`${Math.round(i*px)},${Math.round(h-p.b*h/3)}`).join(' ');
        result=`<div style="margin-top:8px;text-align:center"><div style="font-size:.9rem;font-weight:bold;color:var(--accent-dark)">${label} (r=${r.toFixed(2)})</div><div style="font-size:.7rem;color:var(--text-dim);margin:4px 0">${pairs.length} data points${corrLag==='next'?' (B shifted +1 day)':''}</div><svg viewBox="-5 -5 ${w+10} ${h+20}" style="width:100%;height:90px;margin-top:4px"><line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--border)" stroke-width="0.5"/><polyline points="${lineA}" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round"/><polyline points="${lineB}" fill="none" stroke="var(--success-dark)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4"/><text x="${w}" y="${h+12}" font-size="7" fill="var(--text-dim)" text-anchor="end">${mA.name} ━ / ${mB.name} ┄</text></svg></div>`;
      } else {result=`<p style="font-size:.8rem;color:var(--text-dim);margin-top:8px;text-align:center">Need at least 2 overlapping days of data.</p>`}
    }
  }
  return `<div class="fcard" style="margin-bottom:14px">
    <div style="font-size:.85rem;font-weight:600;margin-bottom:8px">🔗 Correlation</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
      <select id="corr-a" class="inf" style="flex:1;margin:0;font-size:.85rem""><option value="">Select A</option>${opts}</select>
      <span class="rl">vs</span>
      <select id="corr-b" class="inf" style="flex:1;margin:0;font-size:.85rem"><option value="">Select B</option>${opts2}</select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button id="corr-same" class="cat-btn ${corrLag==='same'?'cat-active':''}" style="background:var(--card-neutral)">Same day</button>
      <button id="corr-next" class="cat-btn ${corrLag==='next'?'cat-active':''}" style="background:var(--card-neutral)">Next day</button>
    </div>
    ${result}
  </div>`;
}
let expandedMetric=null,metMonth=new Date().getMonth(),metYear=new Date().getFullYear(),corrA='',corrB='',corrLag='same';
function rMetrics(){
  if(!D.metrics)D.metrics=[];
  const t=today();
  const icons=['😩','😕','🙂','😄'];
  const cards=D.metrics.map(m=>{
    const todayEntry=m.entries.find(e=>e.date===t);
    const isExp=expandedMetric===m.id;
    let graphView='';
    if(isExp){
      // Build Option C graph for selected month
      const dim=new Date(metYear,metMonth+1,0).getDate();
      const mnName=new Date(metYear,metMonth).toLocaleString('default',{month:'long',year:'numeric'});
      const w=280,h=100;
      const dayData=[];for(let d=1;d<=dim;d++){const ds=`${metYear}-${String(metMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const entry=m.entries.find(e=>e.date===ds);dayData.push(entry?entry.val:null)}
      // Build broken polyline segments (connect only adjacent logged days)
      let segments='';let seg=[];
      for(let d=0;d<dim;d++){
        if(dayData[d]!==null){seg.push({x:Math.round(d*w/(dim-1)),y:Math.round(h-dayData[d]*h/3)})}
        else{if(seg.length>1){segments+=`<polyline points="${seg.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="var(--accent-dark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`}seg=[]}
      }
      if(seg.length>1){segments+=`<polyline points="${seg.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="var(--accent-dark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`}
      // Dots for all logged days
      const dots=dayData.map((v,d)=>v!==null?`<circle cx="${Math.round(d*w/(dim-1))}" cy="${Math.round(h-v*h/3)}" r="3.5" fill="var(--accent-dark)"/>`:'').join('');
      // Stats
      const all=m.entries.filter(e=>e.val!=null);
      const lifeAvg=all.length?icons[Math.min(3,Math.round(all.reduce((s,e)=>s+e.val,0)/all.length))]:'—';
      const mEntries=m.entries.filter(e=>e.date.slice(0,7)===`${metYear}-${String(metMonth+1).padStart(2,'0')}`);
      const moAvg=mEntries.length?icons[Math.min(3,Math.round(mEntries.reduce((s,e)=>s+e.val,0)/mEntries.length))]:'—';
      const w7=m.entries.filter(e=>(new Date()-new Date(e.date))/864e5<7);
      const wkAvg=w7.length?icons[Math.min(3,Math.round(w7.reduce((s,e)=>s+e.val,0)/w7.length))]:'—';
      // Trend: linear regression slope on last 14 entries
      const recent=all.slice(-14);
      let trend='—';
      if(recent.length>=3){
        const n=recent.length;const xs=[...Array(n).keys()];
        const xm=xs.reduce((s,x)=>s+x,0)/n,ym=recent.reduce((s,e)=>s+e.val,0)/n;
        const num=xs.reduce((s,x,i)=>s+(x-xm)*(recent[i].val-ym),0);
        const den=xs.reduce((s,x)=>s+(x-xm)*(x-xm),0);
        const slope=den?num/den:0;
        trend=slope>0.05?'📈 Improving':slope<-0.05?'📉 Declining':'➡️ Steady';
      }

      graphView=`<div id="met-graph-${m.id}" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button class="met-prev ibtn" data-id="${m.id}">◀</button><span style="font-size:.8rem;color:var(--text-dim)">${mnName}</span><button class="met-next ibtn" data-id="${m.id}">▶</button></div>
        <svg viewBox="-20 -5 ${w+25} ${h+25}" style="width:100%;height:110px;">
          <text x="-5" y="8" font-size="10" text-anchor="end">😄</text>
          <text x="-5" y="${h/3+4}" font-size="10" text-anchor="end">🙂</text>
          <text x="-5" y="${h*2/3+4}" font-size="10" text-anchor="end">😕</text>
          <text x="-5" y="${h+4}" font-size="10" text-anchor="end">😩</text>
          <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--border)" stroke-width="1"/>
          <line x1="0" y1="${h*2/3}" x2="${w}" y2="${h*2/3}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4"/>
          <line x1="0" y1="${h/3}" x2="${w}" y2="${h/3}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4"/>
          <line x1="0" y1="0" x2="${w}" y2="0" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4"/>
          ${segments}${dots}
          <text x="0" y="${h+14}" font-size="7" fill="var(--text-dim)">1</text>
          <text x="${w/2}" y="${h+14}" font-size="7" fill="var(--text-dim)" text-anchor="middle">${Math.ceil(dim/2)}</text>
          <text x="${w}" y="${h+14}" font-size="7" fill="var(--text-dim)" text-anchor="end">${dim}</text>
        </svg>
        <div style="display:flex;justify-content:space-around;font-size:.75rem;color:var(--text-dim);margin-top:8px;text-align:center">
          <div><div style="font-weight:bold">${wkAvg}</div>7 day</div>
          <div><div style="font-weight:bold">${moAvg}</div>Month</div>
          <div><div style="font-weight:bold">${lifeAvg}</div>Lifetime</div>
          <div><div style="font-weight:bold;font-size:.7rem">${trend}</div>Trend</div>
        </div>
      </div>`;
    }
    return `<div class="fcard" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <b class="mname" data-id="${m.id}" style="cursor:pointer;">${m.name}</b>
        <button class="mdel ibtn" data-id="${m.id}" style="font-size:.9rem;">🗑️</button>
      </div>
      <div style="display:flex;justify-content:space-around;">
        ${icons.map((ic,i)=>`<button class="mlog" data-id="${m.id}" data-val="${i}" style="font-size:1.5rem;padding:8px 12px;border-radius:10px;border:${todayEntry&&todayEntry.val===i?'2px solid var(--accent-dark)':'2px solid transparent'};background:${todayEntry&&todayEntry.val===i?'var(--card-task)':'transparent'};cursor:pointer;">${ic}</button>`).join('')}
      </div>
      ${graphView}
    </div>`;
  }).join('');
  return `<div class="vc">
    <button class="tback">← Back</button>
    <h2 style="font-size:1.1rem;color:var(--accent-dark);margin-bottom:12px;">📊 Metrics</h2>
    <p style="font-size:.8rem;color:var(--text-dim);margin-bottom:12px;">Tap an icon to log today. Tap the name to see your graph.</p>
    ${D.metrics.length>=2?rCorrelation():''}
    ${cards||'<p style="color:var(--text-dim);font-style:italic;">No metrics yet. Add one below!</p>'}
    <div style="display:flex;gap:8px;margin-top:12px;">
      <input id="met-new" type="text" placeholder="New metric (e.g. Productive)" class="inf" style="flex:1;margin:0;">
      <button id="met-add" class="btn bpri" style="padding:10px 16px;">+</button>
    </div>
  </div>`;
}

function showHistDetail(idx){
  const e=D.pointsHistory[idx];if(!e)return;

  if(e.planTasks&&e.planTasks.length){
    const dateStr=new Date(e.date.slice(0,10)+'T12:00:00').toLocaleDateString('default',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
    const timeParts=e.date.slice(11,16);const hr=parseInt(timeParts.split(':')[0]),min=timeParts.split(':')[1];
    const ampm=hr>=12?'PM':'AM';const hr12=hr%12||12;
    const time=`${hr12}:${min} ${ampm}`;
    const totalH=Math.floor((e.seconds||0)/3600),totalM=Math.floor(((e.seconds||0)%3600)/60),totalS=(e.seconds||0)%60;
    let durStr='';if(totalH>0)durStr+=totalH+'h ';if(totalM>0)durStr+=totalM+'m ';durStr+=totalS+'s';
    const completed=e.planTasks.filter(st=>st.completed).length;

      const sm=Math.floor((st.seconds||0)/60),ss=(st.seconds||0)%60;

      else if(st.countBased&&st.ptsAmount){rateInfo=`${st.ptsAmount} pts / ${st.ptsPerCount} ${st.countUnit}`}
      else if(st.flatPoints){rateInfo=`+${st.flatPoints} pts flat`}
      let countInfo=st.countBased&&st.count?`${st.count} ${st.countUnit}`:'';
      const detailParts=[timeInfo,countInfo,rateInfo].filter(Boolean).join(' · ');

      return `<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><div style="flex:1"><div style="font-size:.9rem;font-weight:500">${icon} ${st.name}</div><div style="font-size:.75rem;color:var(--text-dim)">${detailParts||'—'}</div></div><span style="font-weight:bold;color:var(--success-dark);margin-right:8px">+${st.points}</span><button class="plan-st-edit ibtn" data-idx="${idx}" data-si="${si}">✏️</button></div>`;

    document.querySelectorAll('.plan-st-edit').forEach(btn=>btn.addEventListener('click',()=>{
      const hi=parseInt(btn.dataset.idx),si=parseInt(btn.dataset.si);

      let fields=`<label class="rl">Minutes</label><input id="pse-min" type="number" min="0" value="${mVal}" class="inf" style="text-align:center"><label class="rl">Seconds</label><input id="pse-sec" type="number" min="0" max="59" value="${sVal}" class="inf" style="text-align:center">`;

      fields+=`<label class="rl">Points</label><input id="pse-pts" type="number" min="0" value="${st.points}" class="inf" style="text-align:center">`;
      modal(`<h2 style="color:var(--accent-dark);margin-bottom:12px">Edit: ${st.name}</h2>${fields}<button id="pse-save" class="btn bpri" style="width:100%;margin-top:12px">Save</button><button id="pse-cancel" class="btn bmut" style="width:100%;margin-top:8px">Cancel</button>`);
      document.getElementById('pse-save')?.addEventListener('click',()=>{
        const newMin=parseInt(document.getElementById('pse-min')?.value)||0;
        const newSec=parseInt(document.getElementById('pse-sec')?.value)||0;

        save();showHistDetail(hi);

      document.getElementById('pse-cancel')?.addEventListener('click',()=>showHistDetail(hi));
    }));
    return;
  }
  const timeParts=e.date.slice(11,16);const hr=parseInt(timeParts.split(':')[0]),min=timeParts.split(':')[1];
  const ampm=hr>=12?'PM':'AM';const hr12=hr%12||12;
  const time=e.task==='🎯 Daily goal bonus'?'':`${hr12}:${min} ${ampm}`;
  const dateStr=new Date(e.date.slice(0,10)+'T12:00:00').toLocaleDateString('default',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
  let details=[];
  if(time)details.push(`<div><b>Time:</b> ${time}</div>`);
  details.push(`<div><b>Date:</b> ${dateStr}</div>`);
  details.push(`<div><b>Points:</b> ${e.type==='earned'?'+':''}${e.points}</div>`);
  if(e.bonus)details.push(`<div><b>Completion bonus:</b> +${e.bonus}</div>`);
  if(e.rate)details.push(`<div><b>Rate:</b> ${e.rate}</div>`);
  if(e.pomo)details.push(`<div><b>Pomodoro:</b> ${e.pomo} (work/break)</div>`);
  if(e.seconds!=null){const h=Math.floor(e.seconds/3600),m=Math.floor((e.seconds%3600)/60),s=e.seconds%60;let dur='';if(h>0)dur+=h+'h ';if(m>0)dur+=m+'m ';dur+=s+'s';details.push(`<div><b>Duration:</b> ${dur.trim()}</div>`)}
  else if(e.minutes!=null){const h=Math.floor(e.minutes/60),m=e.minutes%60;let dur='';if(h>0)dur+=h+'h ';if(m>0)dur+=m+'m';details.push(`<div><b>Duration:</b> ${dur.trim()||'0m'}</div>`)}
  if(e.count!=null)details.push(`<div><b>Count:</b> ${e.count} ${e.countUnit||'units'}</div>`);
  if(e.category)details.push(`<div><b>Category:</b> ${e.category==='work'?'💼 Work':e.category==='home'?'🏠 Home':e.category==='growth'?'🌱 Growth':e.category}</div>`);
  if(e.taskType)details.push(`<div><b>Type:</b> ${e.taskType==='one-time'?'🎯 One-Time':e.taskType==='recurring'?'🔄 Recurring':e.taskType==='daily'?'📅 Daily':e.taskType==='evergreen'?'♾️ Evergreen':e.taskType}</div>`);
  if(e.taskId){const allForTask=D.pointsHistory.filter(h=>h.taskId===e.taskId&&h.type==='earned');const totalMins=allForTask.reduce((s,h)=>s+(h.minutes||0),0);if(totalMins>0){const th=Math.floor(totalMins/60),tm=totalMins%60;let dur='';if(th>0)dur+=th+' hour'+(th>1?'s':'');if(tm>0)dur+=(dur?' and ':'')+tm+' minute'+(tm>1?'s':'');details.push(`<div><b>Total invested:</b> ${dur}</div>`)}}
  modal(`<h2 style="color:var(--accent-dark);margin-bottom:8px">${e.task}</h2><div style="font-size:.85rem;line-height:1.8;margin-bottom:16px">${details.join('')}</div><button data-close class="btn bmut" style="width:100%">Close</button>`);
}

let vizMonth=new Date().getMonth(),vizYear=new Date().getFullYear();
function taskViz(task,hist){
  if(!hist.length)return '<p style="font-size:.8rem;color:var(--text-dim);margin-bottom:14px;font-style:italic">No history yet.</p>';
  const mnName=new Date(vizYear,vizMonth).toLocaleString('default',{month:'long',year:'numeric'});
  const nav=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button id="viz-prev" class="ibtn">◀</button><span style="font-size:.8rem;color:var(--text-dim)">${mnName}</span><button id="viz-next" class="ibtn">▶</button></div>`;
  if(task.timeBased||task.countBased){
    // Bar graph: minutes or counts per day for the selected month
    const dim=new Date(vizYear,vizMonth+1,0).getDate();
    const bars=[];for(let d=1;d<=dim;d++){const ds=`${vizYear}-${String(vizMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;bars.push(hist.filter(h=>h.date.slice(0,10)===ds).reduce((s,h)=>s+(task.timeBased?(h.minutes||0):(h.count||0)),0))}
    const goalTarget=(task.goal&&task.goal.period==='daily')?task.goal.target:0;
    const weeklyTarget=(task.goal&&task.goal.period==='weekly')?task.goal.target:0;
    const monthlyTarget=(task.goal&&task.goal.period==='monthly')?task.goal.target:0;
    let effectiveMax=Math.max(...bars,goalTarget,1);
    // Compute cumulative for weekly or monthly goals
    if(weeklyTarget>0){
      effectiveMax=Math.max(effectiveMax,weeklyTarget);
      let weekSum=0;
      for(let d=1;d<=dim;d++){const dow=new Date(vizYear,vizMonth,d).getDay();if(dow===1)weekSum=0;weekSum+=bars[d-1];effectiveMax=Math.max(effectiveMax,weekSum)}
    }
    if(monthlyTarget>0){
      effectiveMax=Math.max(effectiveMax,monthlyTarget);
      let mSum=0;for(let d=0;d<dim;d++){mSum+=bars[d];effectiveMax=Math.max(effectiveMax,mSum)}
    }
    const maxVal=effectiveMax;
    const w=280,h=80,bw=w/dim;
    const barSvg=bars.map((v,i)=>{const bh=v>0?Math.max(2,v/maxVal*h):0;const fill=goalTarget>0&&v>=goalTarget?'var(--success-dark)':'var(--accent)';return `<rect x="${i*bw+0.5}" y="${h-bh}" width="${bw-1}" height="${bh}" fill="${fill}" rx="1.5"/>`}).join('');
    // Daily goal line
    const goalLine=goalTarget>0?`<line x1="0" y1="${h-goalTarget/maxVal*h}" x2="${w}" y2="${h-goalTarget/maxVal*h}" stroke="var(--danger-dark)" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>`:'';
    const goalLabel=goalTarget>0?`<div style="position:absolute;top:${Math.max(0,(1-goalTarget/maxVal)*100-2)}%;right:0;font-size:.5rem;color:var(--danger-dark);font-weight:bold">goal: ${goalTarget}${task.timeBased?'m':''}</div>`:'';
    // Weekly goal: separate line segments per week + target line
    let cumOverlay='',cumGoalLine='',cumLabel='';
    if(weeklyTarget>0){
      const wGoalY=h-weeklyTarget/maxVal*h;
      cumGoalLine=`<line x1="0" y1="${wGoalY}" x2="${w}" y2="${wGoalY}" stroke="var(--danger-dark)" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>`;
      cumLabel=`<div style="position:absolute;top:${Math.max(0,(1-weeklyTarget/maxVal)*100-2)}%;right:0;font-size:.5rem;color:var(--danger-dark);font-weight:bold">goal: ${weeklyTarget}${task.timeBased?'m':''}/wk</div>`;
      // Build separate polyline per week, green if goal met
      let segments=[];let segTotals=[];let seg=[];let weekSum=0;
      for(let d=1;d<=dim;d++){
        const dow=new Date(vizYear,vizMonth,d).getDay();
        if(dow===1&&seg.length>0){segments.push(seg);segTotals.push(weekSum);seg=[];weekSum=0}
        weekSum+=bars[d-1];
        const x=(d-0.5)*bw;
        const y=h-weekSum/maxVal*h;
        seg.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      if(seg.length>0){segments.push(seg);segTotals.push(weekSum)}
      cumOverlay=segments.map((s,i)=>{const color=segTotals[i]>=weeklyTarget?'var(--success-dark)':'var(--warning-dark)';return `<polyline points="${s.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>`}).join('');
    }
    // Monthly goal: single cumulative line across the month + target line
    if(monthlyTarget>0){
      const mGoalY=h-monthlyTarget/maxVal*h;
      cumGoalLine=`<line x1="0" y1="${mGoalY}" x2="${w}" y2="${mGoalY}" stroke="var(--danger-dark)" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>`;
      cumLabel=`<div style="position:absolute;top:${Math.max(0,(1-monthlyTarget/maxVal)*100-2)}%;right:0;font-size:.5rem;color:var(--danger-dark);font-weight:bold">goal: ${monthlyTarget}${task.timeBased?'m':''}/mo</div>`;
      let mSum=0;let pts=[];
      for(let d=1;d<=dim;d++){
        mSum+=bars[d-1];
        const x=(d-0.5)*bw;
        const y=h-mSum/maxVal*h;
        pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      const mColor=mSum>=monthlyTarget?'var(--success-dark)':'var(--warning-dark)';
      cumOverlay=`<polyline points="${pts.join(' ')}" fill="none" stroke="${mColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>`;
    }
    const unit=task.timeBased?'m':(task.countUnit||'');
    function fmtAxis(val){if(!task.timeBased)return val+unit;if(val>=60){const hr=Math.floor(val/60),mn=val%60;return mn>0?hr+'h'+mn+'m':hr+'h'}return val+'m'}
    const yTop=fmtAxis(maxVal);
    const midVal=Math.round(maxVal/2);
    const yMid=midVal>0&&midVal!==maxVal?fmtAxis(midVal):'';
    return `<div style="margin-bottom:14px">${nav}<div style="position:relative;padding-left:20px"><svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:100px;"><line x1="0" y1="0" x2="${w}" y2="0" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3"/><line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--border)" stroke-width="1"/>${goalLine}${cumGoalLine}${barSvg}${cumOverlay}<text x="0" y="${h+12}" font-size="7" fill="var(--text-dim)">1</text><text x="${w/2}" y="${h+12}" font-size="7" fill="var(--text-dim)" text-anchor="middle">${Math.ceil(dim/2)}</text><text x="${w}" y="${h+12}" font-size="7" fill="var(--text-dim)" text-anchor="end">${dim}</text></svg><div style="position:absolute;top:0;left:0;font-size:.55rem;color:var(--text-dim)">${yTop}</div><div style="position:absolute;top:45%;left:0;font-size:.55rem;color:var(--text-dim)">${yMid}</div>${goalLabel}${cumLabel}</div></div>`;
  } else {
    // Mini calendar for selected month with checkmarks
    const dim=new Date(vizYear,vizMonth+1,0).getDate(),fd=new Date(vizYear,vizMonth,1).getDay();
    const completedDays=new Set(hist.map(h=>h.date.slice(0,10)));
    let cells='';for(let i=0;i<fd;i++)cells+='<div style="height:22px"></div>';
    for(let d=1;d<=dim;d++){
      const ds=`${vizYear}-${String(vizMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const done=completedDays.has(ds);
      cells+=`<div style="text-align:center;font-size:.7rem;height:22px;line-height:22px;${done?'background:var(--success);border-radius:4px;color:#166534;font-weight:bold':'color:var(--text-dim)'}">${done?'✓':d}</div>`;
    }
    // Pad to always have 6 rows (42 cells total)
    const totalCells=fd+dim;const padCells=42-totalCells;

}

// Plan mode helpers: advance queue to next incomplete task, check if all done
function planAdvanceToNext(){
  T.planQueue.push(T.planQueue.shift());
  // Skip past completed tasks to find next incomplete one
  const maxLoops=T.planQueue.length;
  for(let i=0;i<maxLoops;i++){
    if(!T.planCompleted?.includes(T.planQueue[0]))break;
    T.planQueue.push(T.planQueue.shift());
  }
  T.taskId=T.planQueue[0]||'';T.planCurrentStart=Date.now();
}
function planAllDone(){return T.planQueue.every(tid=>T.planCompleted?.includes(tid));}

function startSW(){
  const selTask=document.getElementById('swt')?.value||'';
  const isPlan=selTask==='__plan__';
  const p=isPlan?1:parseInt(document.getElementById('swp').value),r=isPlan?1:parseInt(document.getElementById('swr').value);
  const planQueue=isPlan?D.plan.filter(tid=>{const t=D.tasks.find(x=>x.id===tid);if(!t)return false;const td=today();if(t.type==='one-time')return!t.completed;if(t.type==='daily')return!D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));if(t.type==='recurring')return!(t.lastCompleted&&(new Date()-new Date(t.lastCompleted))/864e5<t.cadenceDays);if(t.type==='evergreen')return!D.pointsHistory.some(h=>h.taskId===t.id&&h.type==='earned'&&h.date.slice(0,10)===td&&h.task.includes('✅'));return true}):[];
  T={running:true,paused:false,mode:'sw',start:Date.now(),elapsed:0,workDur:25,breakDur:5,phase:'work',
    note:isPlan?'':document.getElementById('swn')?.value||'',taskId:isPlan?(planQueue[0]||''):selTask,pts:p,per:r,
    planMode:isPlan,planQueue:planQueue,planTimes:isPlan?{}:{},planCurrentStart:isPlan?Date.now():0,planCompleted:[],planCounts:{}};
  startTick()}
function startPM(){
  const w=parseInt(document.getElementById('pmw')?.value)||25,b=parseInt(document.getElementById('pmb')?.value)||5;
  const selTask=document.getElementById('pmt')?.value||'';

function getWeekRecap(){
  // Last Mon-Sun
  const now=new Date();const dayOfWeek=now.getDay();
  const lastSun=new Date(now);lastSun.setDate(now.getDate()-(dayOfWeek||7));
  const lastMon=new Date(lastSun);lastMon.setDate(lastSun.getDate()-6);
  const monStr=lastMon.toISOString().slice(0,10),sunStr=lastSun.toISOString().slice(0,10);
  const entries=D.pointsHistory.filter(h=>h.date.slice(0,10)>=monStr&&h.date.slice(0,10)<=sunStr);
  const earned=entries.filter(h=>h.type==='earned').reduce((s,h)=>s+h.points,0);
  const tasks=entries.filter(h=>h.type==='earned'&&h.task!=='🎯 Daily goal bonus').length;
  const mins=entries.reduce((s,h)=>s+(h.minutes||0),0);
  const goalDays=Object.keys(D.dailyGoalLog).filter(d=>d>=monStr&&d<=sunStr&&D.dailyGoalLog[d]&&D.dailyGoalLog[d]!==true).length;
  const metDays=Object.keys(D.dailyGoalLog).filter(d=>d>=monStr&&d<=sunStr&&D.dailyGoalLog[d]&&D.dailyGoalLog[d]!==true&&ptsForDay(d)>=D.dailyGoalLog[d]).length;
  return{monStr,sunStr,earned,tasks,mins,goalDays,metDays};
}

    <div style="font-size:2rem;margin-bottom:8px">📊</div>
    <h2 style="color:var(--accent-dark);margin-bottom:12px">Weekly Recap</h2>
    <p style="font-size:.8rem;color:var(--text-dim);margin-bottom:12px">${new Date(r.monStr+'T12:00:00').toLocaleDateString('default',{month:'short',day:'numeric'})} – ${new Date(r.sunStr+'T12:00:00').toLocaleDateString('default',{month:'short',day:'numeric'})}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="sbox"><div class="sn">${r.earned}</div><div class="sl">Points earned</div></div>
      <div class="sbox"><div class="sn">${r.tasks}</div><div class="sl">Tasks done</div></div>
      <div class="sbox"><div class="sn">${r.mins>0?Math.round(r.mins/60*10)/10+'h':'—'}</div><div class="sl">Hours logged</div></div>
      <div class="sbox"><div class="sn">${r.metDays}/${r.goalDays}</div><div class="sl">Goals hit</div></div>
    </div>
    <button data-close class="btn bpri" style="width:100%;">Nice!</button>
  </div>`);
}

function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='productivity_tracker_backup_'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

loadL();updateStreak();
// Seed achievements tracker on first run so existing achievements don't popup
if(!D._unlockedAchievements){D._unlockedAchievements=getAchievements().filter(a=>a.done).map(a=>a.name);saveL()}
if(!D._lastLevel){D._lastLevel=getLevel().level;saveL()}
if(D.settings.gistId&&D.settings.token)gistPull().then(()=>{updateStreak();render();showStartupModals()});
else{render();showStartupModals()}
function showStartupModals(){
  // Reset daily goal each new day
  const t=today();
  if(D._lastDay!==t){D.settings.dailyGoal=0;D._lastDay=t;saveL()}
  const dow=new Date().getDay();
  if(dow===1&&D._lastRecap!==getWeekRecap().monStr){showWeekRecap(true);return}
  showGoodMorning();
}
// Push when app is backgrounded/closed
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){saveL();gistPush()}});
window.addEventListener('pagehide',()=>{saveL();gistPush()});
</script>

name: Check Reminders
on:
  workflow_dispatch: {}
  schedule:
    # Every 5 minutes — GitHub's minimum interval. This is the only lever we have on how
    # close to the scheduled time a reminder goes out: the script refuses to send before
    # `reminder.time`, so the wait is however long until the next run fires. 15 minutes meant
    # up to a quarter hour of built-in lag on top of GitHub's own scheduler delay, which is
    # best-effort and can be significant under load. De-dupe is per day, so extra runs are
    # harmless. Delivery speed on the device is handled separately via urgency/TTL in the script.
    - cron: '*/5 * * * *'

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node check-reminders.js
        working-directory: scripts
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

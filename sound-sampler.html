<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Sampler</title>

</head><body>

<script>
function ac(){return new(window.AudioContext||window.webkitAudioContext)()}

// === Pops & Clicks ===

function s16(){const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.exponentialRampToValueAtTime(900,c.currentTime+0.1);o.frequency.exponentialRampToValueAtTime(600,c.currentTime+0.15);g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.2);o.start();o.stop(c.currentTime+0.2)}

function s38(){const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(180,c.currentTime);o.frequency.setValueAtTime(185,c.currentTime+0.05);o.frequency.setValueAtTime(180,c.currentTime+0.1);o.frequency.setValueAtTime(185,c.currentTime+0.15);g.gain.setValueAtTime(0.2,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.3);o.start();o.stop(c.currentTime+0.3)}

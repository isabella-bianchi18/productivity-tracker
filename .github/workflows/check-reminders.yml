name: Check Reminders
on:
  workflow_dispatch: {}
  schedule:
    # Runs every 15 minutes. GitHub's cron scheduler is best-effort and can run
    # late, especially during high load — reminders are de-duped by date, not
    # by exact time, so a late run still fires correctly, just not to the minute.
    - cron: '*/15 * * * *'

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node check-reminders.js
        working-directory: scripts
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
